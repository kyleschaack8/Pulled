<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="images/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<title>Pulled — Trading Card Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one app shell, sticky top bar, single content column up to 1120px; views swap by hash. Single dark look by design. */
:root {
  --bg: #0A0C10;
  --surface: #12161E;
  --raise: #1A1F29;
  --line: #262C38;
  --fg: #F2F4F8;
  --muted: #A3AAB8;
  --faint: #8D94A3;
  --accent: #C6F432;
  --accent-ink: #0A0C10;
  --up: #4ADE80;
  --down: #FF7A66;
  --game: #F59E3B;
  --news: #7EA2FF;
  --s2: #7EA2FF;
  --s3: #F59E3B;
  --s4: #E879F9;
  --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
.brand .logo-icon { display: block; margin: -6px 0; overflow: visible; }
.brand .logo-word { display: block; }
.brand span { color: var(--accent); }
.gsearch { position: relative; flex: 1 1 260px; max-width: 440px; min-width: 0; }
.gsearch > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.gsearch input { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 40px; font-size: 15px; }
.gsearch input:focus { border-color: var(--faint); }
.gresults { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.45); max-height: min(70vh, 520px); overflow-y: auto; padding: 6px; }
.gresults .ghead { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; }
.gres { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); min-height: 44px; }
.gres[aria-selected="true"], .gres:hover { background: var(--raise); }
.gres .gm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gres .gt { font-weight: 700; font-size: 14px; }
.gres .gs { font-size: 12px; color: var(--faint); }
.gres .gthumb { display: block; width: 30px; height: 42px; flex-shrink: 0; overflow: hidden; }
.gres .gbadge { width: 30px; height: 30px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: var(--muted); flex-shrink: 0; }
.gres mark { background: none; color: var(--accent); }
.gempty { padding: 14px 10px; color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) { .gsearch { order: 3; flex-basis: 100%; max-width: none; } }
/* Hot cards: a canvas fire simulation sits behind the top risers */
.flame { position: relative; isolation: isolate; }
.flame > canvas.fire { position: absolute; pointer-events: none; z-index: -1; }
.flame.big { box-shadow: 0 0 40px 6px rgba(255,110,20,.18); border-radius: 12px; }
/* Cold cards: frost, mist and snow on the biggest drops */
.frost { position: relative; isolation: isolate; }
.frost > canvas.mist { position: absolute; pointer-events: none; z-index: -1; }
.frost > canvas.rime { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; border-radius: 7px; }
.frost.big { box-shadow: 0 0 36px 6px rgba(120,190,255,.2); border-radius: 12px; }
.cold { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; color: #04131f; background: linear-gradient(90deg, #d8f3ff, #6ab8ff); flex-shrink: 0; }
.cold svg { display: block; }
.hot { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; color: #1a0800; background: linear-gradient(90deg, #ffb300, #ff6a00); flex-shrink: 0; }
.hot svg { display: block; }
.pavatar { width: 132px; height: 132px; flex-shrink: 0; max-width: 100%; }
.havatar { width: 56px; height: 56px; flex-shrink: 0; }
.gavatar { width: 38px; height: 38px; flex-shrink: 0; display: block; }
.pavatar svg, .havatar svg, .gavatar svg { display: block; }
@media (max-width: 520px) { .pavatar { width: 96px; height: 96px; } }
.cav { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 800; color: #0a0c10; background: hsl(var(--h) 70% 72%); flex-shrink: 0; letter-spacing: -.02em; }
.stag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); white-space: nowrap; }
.st-sale { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); border-color: color-mix(in srgb, var(--up) 35%, var(--line)); }
.st-trade { color: var(--news); background: color-mix(in srgb, var(--news) 12%, transparent); border-color: color-mix(in srgb, var(--news) 35%, var(--line)); }
.st-keep { color: var(--faint); background: var(--raise); }
.st-match { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; cursor: pointer; min-height: 44px; }
.pick:hover { border-color: var(--faint); }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.pick .thumb { width: 36px; height: 50px; flex-shrink: 0; display: block; }
.pick .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pick .title { font-weight: 700; font-size: 14px; }
.pick .sub { font-size: 12px; color: var(--faint); }
.pick .end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.pick .tick { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
.pick[aria-pressed="true"] .tick { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.meterrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
@media (max-width: 560px) { .meterrow { grid-template-columns: 1fr 1fr; } .meterrow .meter { grid-column: 1 / -1; order: 3; } }
.mside { display: flex; flex-direction: column; gap: 2px; }
.mside .k { font-size: 12px; color: var(--faint); }
.mside .v { font-size: 24px; font-weight: 600; }
.meter { position: relative; padding: 6px 0 24px; }
.mzone { height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--game) 0%, var(--raise) 34%, var(--up) 44%, var(--up) 56%, var(--raise) 66%, var(--game) 100%); }
.mmark { position: absolute; top: 0; width: 5px; height: 24px; border-radius: 3px; background: var(--fg); transform: translateX(-50%); box-shadow: 0 0 0 3px var(--surface); transition: left .3s; }
.mlabels { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.mverdict { margin: 0; font-weight: 700; font-size: 16px; }
.mverdict.up { color: var(--up); } .mverdict.down { color: var(--game); } .mverdict.flat { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .mmark { transition: none; } }
.blayout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.fpanel { flex: 1 1 240px; max-width: 270px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bmain { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.fpanel .ftoggle { display: none; width: 100%; }
.fbody { display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 760px) { .fpanel { max-width: none; } .fpanel .ftoggle { display: flex; } .fpanel:not(.open) .fbody { display: none; } }
.fgroup { display: flex; flex-direction: column; gap: 4px; }
.fhead { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.fcount { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; font-size: 10px; letter-spacing: 0; }
.fopt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 4px 6px; border: none; background: transparent; color: var(--fg); text-align: left; border-radius: 8px; cursor: pointer; font-size: 14px; }
.fopt:hover:not(:disabled) { background: var(--raise); }
.fopt:disabled { opacity: .38; cursor: default; }
.fbox { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--faint); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.fopt[aria-pressed="true"] .fbox { background: var(--accent); border-color: var(--accent); }
.fopt[aria-pressed="true"] .fbox::after { content: ""; width: 5px; height: 9px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.flab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn { font-size: 12px; color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.fmore { border: none; background: none; color: var(--accent); font-weight: 600; font-size: 13px; text-align: left; padding: 6px; cursor: pointer; }
.fin { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; width: 100%; min-width: 0; }
#fsort.fin { width: auto; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.btile { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.btile:hover { border-color: var(--faint); }
.bimg { aspect-ratio: 5 / 7; margin: 12px 12px 0; max-width: 100%; }
.bbody { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.btile .title { font-weight: 700; font-size: 13px; line-height: 1.3; }
.btile .sub { font-size: 12px; color: var(--faint); }
.achip { background: var(--raise); }
/* Player hero: team-color backdrop with the team name as oversized type */
.phero { position: relative; overflow: hidden; isolation: isolate; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--ta) 30%, var(--line));
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--tp) 75%, #0a0c10) 0%, transparent 60%),
    linear-gradient(115deg, #0b0e13 0%, color-mix(in srgb, var(--tp) 38%, #0b0e13) 48%, color-mix(in srgb, var(--tp) 62%, #0b0e13) 100%);
  padding: clamp(20px, 3.5vw, 36px); padding-bottom: calc(clamp(20px, 3.5vw, 36px) + 14px); min-height: 200px; display: flex; align-items: flex-end; }
.phero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 1px, transparent 1px 14px); }
.phero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(7,9,13,.72) 0%, rgba(7,9,13,.35) 45%, rgba(7,9,13,0) 75%); }
.phero-word { position: absolute; z-index: -1; right: -0.04em; bottom: 0.02em; font-family: 'Anton', 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(110px, 17vw, 230px); line-height: .8; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; color: transparent; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 42%); mask-image: linear-gradient(90deg, transparent 0, #000 42%);
  -webkit-text-stroke: 2px color-mix(in srgb, var(--ta) 55%, transparent); opacity: .9; user-select: none; pointer-events: none; }
.phero-word span { color: color-mix(in srgb, var(--ta) 9%, transparent); -webkit-text-stroke: 0; position: absolute; left: .045em; top: .045em; z-index: -1; }
.phero-city { position: absolute; top: clamp(16px, 3vw, 26px); right: clamp(18px, 3.5vw, 32px); font-size: 12px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: color-mix(in srgb, var(--ta) 80%, #fff); opacity: .85; }
.phero-stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(180deg, var(--tp) 0 5px, #f3e7cf 5px 7px, var(--ts) 7px 12px, transparent 12px); opacity: .95; }
.pchg { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; width: 100%; margin-top: 12px; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.pchg:hover { border-color: var(--faint); }
.pchg .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.pchg .v { font-family: var(--mono); font-size: clamp(26px, 3.4vw, 34px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.pchg .s { font-size: 13px; color: var(--muted); }
.pchg .s b { color: var(--fg); font-weight: 600; }
.pchg .go { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); }
@media (max-width: 560px) { .pchg .k { width: 100%; } .pchg .go { display: none; } }
.phero-in { position: relative; width: 100%; flex: 1 1 auto; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; min-width: 0; }
.phero-in h1 { text-shadow: 0 2px 18px rgba(0,0,0,.45); }
.phero-in .meta { color: rgba(242,244,248,.82); }
.phero .pavatar { box-shadow: 0 10px 30px rgba(0,0,0,.45); border-radius: 30px; }
@media (max-width: 560px) { .phero { min-height: 170px; } .phero-city { display: none; } }
.teamtag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--fg); background: color-mix(in srgb, var(--tc) 22%, var(--raise)); border: 1px solid color-mix(in srgb, var(--tc) 55%, var(--line)); }
.gres .gbadge.team { background: color-mix(in srgb, var(--tc) 22%, var(--raise)); border-color: color-mix(in srgb, var(--tc) 55%, var(--line)); color: var(--fg); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center; }
.nav a:hover { color: var(--fg); background: var(--raise); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--raise); }
.nav .count { margin-left: 6px; font-family: var(--mono); font-size: 12px; color: var(--accent); }

.notice { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--faint); padding-block: 10px; }
main { padding-block: 8px 72px; }
.view { display: flex; flex-direction: column; gap: 28px; }
h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
.about { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.about-bio { display: flex; flex-direction: column; gap: 10px; }
.about-bio p { margin: 0; font-size: 17px; line-height: 1.55; color: var(--text); max-width: 62ch; }
.about-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.drivers { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.drivers h3 { margin: 0; padding: 12px 16px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
.drv { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.drv:last-child { border-bottom: 0; }
.drv-i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--ta, #8d94a3) 18%, transparent); color: var(--text); }
.drv-i.up { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
.drv-i.down { background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); }
.drv b { display: block; font-size: 14px; }
.drv span { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.drv-live { font-size: 10px; letter-spacing: .1em; font-weight: 700; color: var(--up); margin-left: 6px; vertical-align: 1px; }
@media (max-width: 760px) { .about { grid-template-columns: 1fr; } }
.mtiles { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { .mtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mtile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; color: var(--fg); text-decoration: none; }
.mtile.link:hover { border-color: var(--faint); }
.mtile .k { font-size: 12px; color: var(--faint); }
.mtile .v { font-family: var(--mono); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mtile .s { font-size: 12px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pctrl { display: flex; flex-direction: column; gap: 10px; }
.pctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pctrl-k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 2px 0 6px; }
.pctrl-k:first-child { margin-left: 0; }
.chip.sm { min-height: 32px; padding: 0 12px; font-size: 12.5px; }
.plegend { display: flex; flex-wrap: wrap; gap: 6px; }
.pleg { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); font-size: 12px; cursor: pointer; }
.pleg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pleg[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.rstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rs { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-right: 1px solid var(--line); }
.rs:last-child { border-right: 0; }
.rs span { font-size: 11px; color: var(--faint); }
.rs b { font-size: 14px; font-weight: 600; }
.btn.browse-btn { min-height: 38px; font-size: 13px; padding: 0 14px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-decoration: none; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
.pq { flex: 1 1 260px; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 12px; font-size: 14px; }
.gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.gtile { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: visible; min-width: 0; }

.item { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.item:hover { border-color: var(--faint); }
.item .thumb { width: 44px; height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .title { font-weight: 700; font-size: 14px; }
.item .sub { font-size: 12px; color: var(--faint); }
.item .spark { flex-shrink: 0; }
@media (max-width: 520px) { .item .spark { display: none; } }
.item .end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.pcard { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--fg); }
.pcard:hover { border-color: var(--faint); }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 150px; transform: translateX(-50%); }
.tip[hidden] { display: none !important; }
.tip .t { font-weight: 700; margin-bottom: 4px; }
.tip .l { display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.why { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.why .eyebrow { color: var(--accent); }
.why p { margin: 0; font-size: 16px; }
.alert { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; }
.alert.warn { border-color: color-mix(in srgb, var(--game) 45%, var(--line)); background: color-mix(in srgb, var(--game) 8%, var(--surface)); }
.alert.info { border-color: color-mix(in srgb, var(--news) 45%, var(--line)); background: color-mix(in srgb, var(--news) 8%, var(--surface)); }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: none; background: var(--raise); font-size: 12px; color: var(--muted); }
th[scope="row"], thead th:first-child { text-align: left; }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
td.best { color: var(--fg); font-weight: 600; }
.help { display: block; font-size: 11px; color: var(--faint); font-weight: 500; }

.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-top: 1px solid var(--line); }
.check:first-child { border-top: none; }
.dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; border: 2px solid var(--line); }
.dot.done { background: var(--accent); border-color: var(--accent); }
.dot.next { border-color: var(--game); }
.empty { text-align: center; padding: 40px 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }

function cleanSeries(med, cnt) {
  const out = med.slice();
  for (let i = 0; i < out.length; i++) {
    if (out[i] == null || (cnt[i] || 0) > 2) continue;
    const prev = out.slice(0, i).filter(v => v != null).slice(-3).sort((a, b) => a - b);
    if (prev.length < 2) continue;
    const ref = prev[Math.floor(prev.length / 2)];

/* Fill a player's team, number, stats, awards and injury status from data/stats.json */
function applyStats(P, s, p) {
  if (!s) return;
  if (s.team) P.team = s.team;
  if (s.teamAbbr) P.teamAbbr = s.teamAbbr;
  P.color = teamAccent(s.teamColor, s.teamAlt);
  P.teamPrimary = s.teamColor || ''; P.teamSecondary = s.teamAlt || '';
  if (s.jersey) P.num = '#' + s.jersey;
  if (s.position) P.pos = s.position;
  if (s.summary && s.summary.stats && s.summary.stats.length) {
    P.stats = s.summary.stats.map(([k, v, r]) => [k, v, r]);
    P.statsLabel = s.summary.label.replace(/^\w/, c => c.toUpperCase());
  } else if (s.career && s.career.length) {
    P.stats = s.career.slice(0, 4).map(([k, v]) => [k, v, '']);
    P.statsLabel = 'Career';
  }
  const rows = [['This season', s.season], ['Last 5 games', s.last5], ['Projected', s.projected], ['Career', s.career]].filter(([, v]) => v && v.length);
  if (rows.length) {
    const cols = rows[0][1].map(([k]) => k);
    P.table = { cols, rows: rows.map(([label, v]) => [label, cols.map(c => (v.find(([k]) => k === c) || [c, '—'])[1])]) };
    if (s.statsLabel) P.tableLabel = s.statsLabel;
  }
  P.awards = (s.awards || []).filter(a => a[0]);
  P.experience = s.experience || '';
  P.extra = [s.experience, s.draft ? 'Drafted ' + s.draft : ''].filter(Boolean).join(' · ');
  if (s.injury && s.injury.status) {
    const back = s.injury.returnDate ? ` Expected back around ${s.injury.returnDate}.` : '';
    const serious = !/rest|day-to-day/i.test(s.injury.status + ' ' + s.injury.type);
    P.note = { kind: 'warn', title: `Injury report: ${s.injury.status}${s.injury.type ? ' (' + s.injury.type + ')' : ''}`, text: (s.injury.comment || '') + back };
    P.injured = serious ? s.injury.status : '';
  } else if (p.status === 'active') {
    P.note = { kind: 'info', title: 'Injury report', text: 'No current injury designation.' };
  } else {
    P.note = { kind: 'info', title: 'Legacy', text: P.awards.length ? 'Career honors are listed above. Legacy events like Hall of Fame news and anniversaries can move these cards.' : 'Retired players have no live games, so their cards move on legacy news, anniversaries and nostalgia.' };
  }
}

/* combined player trend: % change weighted by how often each card sells */
function playerTrend(pid, range) {
  const cs = CARDS.filter(c => c.p === pid);
  return combined(cs, range);
}
function combined(cs, range) {
  const n = RANGES[range];
  if (!cs.length) return { series: new Array(n).fill(0), change: 0 };
  const w = cs.map(c => Math.max(0.5, avg(slice(c.sales, range))));
  const W = w.reduce((a, b) => a + b, 0);
  const series = [];
  for (let t = 0; t < n; t++) {
    let s = 0;
    cs.forEach((c, k) => { const p = slice(c.price, range); s += w[k] * pct(p[0], p[t]); });
    series.push(s / W);
  }
  return { series, change: last(series) };
}

/* auto-written explanation from price + event data */
function whyItMoved(c) {
  const p = PLAYERS[c.p];

  const dir = m > 0.05 ? 'Up' : m < -0.05 ? 'Down' : 'Flat';
  const recent = p.events.filter(e => e.i >= 9).slice(-1)[0];
  const salesNow = c.sales[11], salesAvg = avg(c.sales.slice(0, 11));
  let s = `${dir} ${fmtPct(Math.abs(m), false).replace('+', '')} this month`;
  if (recent) s += `, following "${recent.label}" (${MONTHS[recent.i]})`;
  s += '. ';
  if (salesAvg > 0 && salesNow > salesAvg * 1.3) s += `Sales picked up to ${salesNow} this month, well above the usual ${Math.round(salesAvg)}. `;
  else if (salesAvg > 0 && salesNow < salesAvg * 0.7) s += `Fewer copies sold than usual, so prices can swing on just a few sales. `;
  s += `Over the past year it is ${y >= 0 ? 'up' : 'down'} ${Math.abs(y).toFixed(0)}%.`;

  return s;

function handlePhoto(file, id) {

  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);

    img.onerror = () => toast("That image couldn't be read. Try a JPG or PNG.");

      .filter(r => isFinite(r.ch) && r.ch >= 10 && r.s >= 3)

        return `<a class="pcard" href="#player-${pid}"><div class="row between"><span class="row" style="gap:6px">${teamTag(p)}<span class="tag">${esc(p.sport)}</span></span><span class="status ${p.injured ? 'injured' : p.status}">${p.injured ? esc(p.injured) : p.status === 'active' ? 'Active' : 'Retired'}</span></div><div class="row" style="gap:12px;flex-wrap:nowrap"><div class="havatar">${playerAvatar(p)}</div><div style="min-width:0"><div style="font-size:18px;font-weight:700">${esc(p.name)}</div><div style="font-size:13px;color:var(--faint)">${esc(p.team)}</div></div></div><div class="row between"><span class="num ${cls(m)}" style="font-size:22px;font-weight:600">${fmtPct(m)}</span>${sparkline(t.series, m >= 0 ? 'var(--up)' : 'var(--down)')}</div></a>`; }).join('') || '<p class="lede">No players match.</p>'}</div></div>
    ${q ? '' : `<div class="cols">
      <div class="section"><div class="row between"><h2>Biggest risers this month</h2><a href="#movers" style="font-weight:600;font-size:14px;text-decoration:none">See all movers →</a></div><div class="list">${sorted.slice(0, 5).map(c => cardItem(c)).join('')}</div></div>
      <div class="section"><h2>Biggest drops this month</h2><div class="list">${sorted.slice(-5).reverse().map(c => cardItem(c)).join('')}</div></div>
    </div>`}
  </div>`;
}
function sparkline(vals, color) {
  const W = 96, H = 32, lo = Math.min(...vals), hi = Math.max(...vals) || 1, r = hi - lo || 1;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i * W / (vals.length - 1)).toFixed(1) + ' ' + (H - 3 - (v - lo) / r * (H - 6)).toFixed(1)).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/* What moves this player's cards: written drivers plus live signals from Pulled's own data */
function seasonPhase(sport, d = new Date()) {
  const m = d.getMonth() + 1;
  if (sport === 'NBA') return m >= 10 || m <= 3 ? ['In season', 'Regular season is on, so game nights and injury reports move prices most.'] : m <= 6 ? ['Playoffs', 'Playoff games move NBA cards more than any other time of year.'] : ['Offseason', 'No games, so trades, free agency and the draft drive prices. Values often drift lower.'];
  if (sport === 'MLB') return m >= 4 && m <= 9 ? ['In season', 'Baseball cards follow hot and cold streaks across the long season.'] : m === 10 ? ['Postseason', 'October performances can move baseball cards sharply.'] : ['Offseason', 'Award voting, trades and signings drive prices until spring training.'];
  if (sport === 'NFL') return m >= 9 || m === 1 ? [m === 1 ? 'Playoffs' : 'In season', m === 1 ? 'Playoff games bring the biggest football price swings.' : 'Football cards climb once games start and react to each week\'s results.'] : m === 2 ? ['Super Bowl', 'Super Bowl results set the tone for the offseason market.'] : ['Offseason', 'Football cards usually cool in the offseason. The draft and contracts are the main news.'];
  return null;
}
function liveDrivers(pid, p, cs) {
  const out = [];
  if (p.status === 'active') {
    const ph = seasonPhase(p.sport); if (ph) out.push(['◷', '', ph[0], ph[1]]);
    if (p.injured) out.push(['+', 'down', 'Injury: ' + p.injured, 'An active injury designation. Cards usually dip until there is a clear return date.']);
  }
  if (cs.length) {
    const t = playerTrend(pid, '3M').change;
    if (isFinite(t)) out.push([t >= 0 ? '▲' : '▼', t >= 0 ? 'up' : 'down', `${fmtPct(t, false)} in 3 months`, t >= 5 ? 'Buyers have been paying more lately across his tracked cards.' : t <= -5 ? 'Prices have been sliding across his tracked cards.' : 'His tracked cards have been fairly flat lately.']);
    const by = {}; cs.forEach(c => { const b = c.id.replace(/-(raw|psa10)$/, ''); (by[b] = by[b] || {})[c.tags.includes('Graded') ? 'g' : 'r'] = last(c.price); });
    const r = Object.values(by).filter(x => x.g && x.r).map(x => x.g / x.r).sort((a, b) => a - b);
    if (r.length) { const m = r[Math.floor(r.length / 2)]; out.push(['×', '', `PSA 10 premium: ${m.toFixed(1)}×`, `A PSA 10 copy typically sells for ${m.toFixed(1)} times a raw copy, so condition matters ${m >= 4 ? 'a lot' : 'some'} here.`]); }
    const vol = cs.reduce((a, c) => a + c.sales.slice(-3).reduce((x, y) => x + y, 0), 0) / 3;
    out.push(['#', '', `About ${Math.round(vol)} sales a month`, vol >= 40 ? 'A busy market, so prices update quickly and are reliable.' : vol >= 10 ? 'Steady trading, enough to trust the trend.' : 'Thin trading, so a single sale can move the price.']);
  }
  return out;
}
function aboutBio(pid, p, cs) {
  const pr = PROFILES[pid], bio = pr && pr.bio ? pr.bio : p.summary;
  return `<div class="about-bio"><span class="eyebrow">Who he is</span><p>${esc(bio)}</p>${pr && p.summary && cs.length ? `<span style="font-size:13px;color:var(--faint)">${esc(p.summary)}</span>` : ''}</div>`;
}
function aboutDrivers(pid, p, cs) {
  const pr = PROFILES[pid], written = pr && pr.drivers ? pr.drivers : [], live = liveDrivers(pid, p, cs);
  if (!written.length && !live.length) return '';
  return `<div class="section"><div class="about" style="--ta:${esc(p.color || '#8d94a3')}">
    ${live.length ? `<div class="drivers"><h3>Right now <span class="drv-live">● LIVE</span></h3>${live.map(([i, k, t, d]) => `<div class="drv"><div class="drv-i ${k}">${esc(i)}</div><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div>` : '<div></div>'}
    ${written.length ? `<div class="drivers"><h3>What moves his cards</h3>${written.map(([t, d], n) => `<div class="drv"><div class="drv-i">${n + 1}</div><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div>` : ''}
  </div></div>`;
}

/* ---------- player card market: snapshot, filterable chart, card gallery ---------- */
let PARTIAL = false;
const P_COLORS = ['#7cc4ff', '#c6f432', '#ff9f5a', '#d39bff', '#5fe0c0', '#ff6b8b', '#ffd25e', '#9aa8ff', '#6fdc7a', '#ff8fd0'];
const baseId = c => c.base || c.id.replace(/-(raw|psa10)$/, '');
const isPSA = c => c.tags.includes('Graded');
function cardGroups(cs) {
  const m = new Map();
  cs.forEach(c => { const b = baseId(c); if (!m.has(b)) m.set(b, { id: b, cards: [] }); const g = m.get(b); g.cards.push(c); if (isPSA(c)) g.psa = c; else g.raw = c; });
  return [...m.values()].map(g => {
    const any = g.raw || g.psa;
    g.name = any.name; g.tags = [...new Set(g.cards.flatMap(c => c.tags.filter(t => t !== 'Graded')))];
    g.prem = g.raw && g.psa ? last(g.psa.price) / last(g.raw.price) : null;
    g.sales = g.cards.reduce((a, c) => a + avg(c.sales.slice(-3)), 0);
    return g;
  });
}
function pFiltered(cs) {
  const q = (state.pQuery || '').trim().toLowerCase();
  return cs.filter(c => (state.pGrade === 'All' || (state.pGrade === 'PSA 10') === isPSA(c))
    && (state.pType === 'All' || c.tags.includes(state.pType))
    && (!q || (c.name + ' ' + c.detail + ' ' + c.tags.join(' ')).toLowerCase().includes(q)));
}
const basket = (cs, range) => { const n = RANGES[range]; return Array.from({ length: n }, (_, t) => cs.reduce((s, c) => s + slice(c.price, range)[t], 0)); };
const shortName = c => c.name.replace(/^(\d{4})(-\d{2})?\s+/, "$1 ") + (isPSA(c) ? ' · PSA 10' : ' · Raw');

function marketSnapshot(pid, p, cs) {
  const now = cs.reduce((s, c) => s + last(c.price), 0), prev = cs.reduce((s, c) => s + c.price[c.price.length - 2], 0);
  const yearB = basket(cs, '1Y'), hi = Math.max(...yearB);
  const si = PARTIAL ? 2 : 1, sMon = String(MONTHS[MONTHS.length - si]).replace(/ '.*/, '');
  const salesNow = cs.reduce((s, c) => s + c.sales[c.sales.length - si], 0), salesAvg = cs.reduce((s, c) => s + avg(c.sales.slice(0, -si)), 0);
  const byPrice = [...cs].sort((a, b) => last(a.price) - last(b.price));
  const hot = [...cs].filter(c => avg(c.sales.slice(-3)) >= 1).sort((a, b) => monthChange(b) - monthChange(a))[0];
  const most = [...cs].sort((a, b) => avg(b.sales.slice(-3)) - avg(a.sales.slice(-3)))[0];
  const prems = cardGroups(cs).map(g => g.prem).filter(Boolean).sort((a, b) => a - b);
  const prem = prems.length ? prems[Math.floor(prems.length / 2)] : null;
  const fromHi = pct(hi, now);
  const tile = (k, v, sub, href, c2) => `<${href ? `a href="${href}"` : 'div'} class="mtile${href ? ' link' : ''}"><span class="k">${k}</span><span class="v ${c2 || ''}">${v}</span><span class="s">${sub}</span></${href ? 'a' : 'div'}>`;
  return `<div class="mtiles">
    ${tile('Market value', money(now), `<span class="${cls(pct(prev, now))}">${fmtPct(pct(prev, now))}</span> this month</span><span class="s">One of each tracked card`)}
    ${tile('From 12-month high', Math.abs(fromHi) < 0.5 ? 'At high' : fmtPct(fromHi, false), Math.abs(fromHi) < 0.5 ? 'Prices are at their best level of the year' : `High was ${money(hi)}`, null, Math.abs(fromHi) < 0.5 ? 'up' : 'down')}
    ${tile(`Sales in ${esc(sMon)}`, String(salesNow), salesAvg ? `<span class="${cls(pct(salesAvg, salesNow))}">${fmtPct(pct(salesAvg, salesNow), false)}</span> vs. the monthly average` : 'Completed sales')}
    ${tile('Cheapest way in', money(last(byPrice[0].price)), esc(shortName(byPrice[0])), '#card-' + byPrice[0].id)}
    ${tile('Top card', money(last(byPrice[byPrice.length - 1].price)), esc(shortName(byPrice[byPrice.length - 1])), '#card-' + byPrice[byPrice.length - 1].id)}
    ${hot ? tile('Hottest card', fmtPct(monthChange(hot)), esc(shortName(hot)), '#card-' + hot.id, cls(monthChange(hot))) : ''}
    ${tile('Most traded', `${Math.round(avg(most.sales.slice(-3)))}/mo`, esc(shortName(most)), '#card-' + most.id)}
    ${prem ? tile('PSA 10 premium', prem.toFixed(1) + '×', 'Typical PSA 10 price vs. a raw copy') : ''}
  </div>`;
}

function marketChart(pid, p, cs) {
  const range = state.playerRange, labels = slice(MONTHS, range), n = labels.length, off = 12 - RANGES[range];
  const evs = state.pEvents === 'on' ? p.events.filter(e => e.i >= off).map(e => ({ ...e, i: e.i - off })) : [];
  const fc = pFiltered(cs);
  const usd = state.pUnit === 'usd';
  const vol = Array.from({ length: n }, (_, t) => fc.reduce((s, c) => s + slice(c.sales, range)[t], 0));
  let series = [], fmt = v => fmtPct(v, false), zero = !usd, note = '', legend = '', log = false;
  const pctS = cs2 => combined(cs2, range).series;
  if (!fc.length) return `<div class="panel" style="color:var(--muted)">No cards match these filters. <button type="button" class="linkbtn" data-act="pReset">Clear filters</button></div>`;
  if (state.pView === 'index') {
    const v = usd ? basket(fc, range) : pctS(fc), up = last(v) >= v[0];
    series = [{ name: usd ? 'Value of one of each' : 'Combined change', values: v, color: up ? 'var(--up)' : 'var(--down)', area: true }];
    if (usd) fmt = money;
    note = usd ? 'What it would cost to own one copy of every card in the filter.' : 'Each card weighted by how often it sells, so one rare sale can\'t skew it.';
  } else if (state.pView === 'grades') {
    const t = cs.filter(c => (state.pType === 'All' || c.tags.includes(state.pType)));
    const r = t.filter(c => !isPSA(c)), g = t.filter(isPSA);
    if (r.length) series.push({ name: 'Raw', values: usd ? basket(r, range).map(x => x / r.length) : pctS(r), color: '#7cc4ff' });
    if (g.length) series.push({ name: 'PSA 10', values: usd ? basket(g, range).map(x => x / g.length) : pctS(g), color: '#ffd25e' });
    if (usd) { fmt = money; zero = false; }
    legend = `<div class="legend">${series.map(s2 => `<span><i style="display:inline-block;width:14px;height:3px;border-radius:2px;background:${s2.color}"></i>${s2.name}</span>`).join('')}</div>`;
    note = usd ? 'Average price of a raw copy vs. a PSA 10 copy. The gap is the grading premium.' : 'Raw and PSA 10 copies often move differently. Grading demand can rise when prices climb.';
  } else {
    const shown = [...fc].sort((a, b) => last(b.price) - last(a.price));
    const live = shown.filter(c => !state.pHidden[c.id]).slice(0, 10);
    series = live.map(c => ({ name: shortName(c), values: usd ? slice(c.price, range).map(v => Math.log10(Math.max(1, v))) : slice(c.price, range).map(v => pct(slice(c.price, range)[0], v)), color: P_COLORS[shown.indexOf(c) % P_COLORS.length] }));
    if (usd) { fmt = v => money(Math.pow(10, v)); zero = false; log = true; }
    legend = `<div class="plegend">${shown.slice(0, 16).map((c, i) => `<button type="button" class="pleg" data-act="pHide" data-id="${c.id}" aria-pressed="${!state.pHidden[c.id]}"><i style="background:${P_COLORS[i % P_COLORS.length]}"></i>${esc(shortName(c))}</button>`).join('')}</div>`;
    note = (usd ? 'Prices on a log scale so cheap and expensive cards fit together. ' : '') + 'Tap a card below the chart to hide or show its line.';
    if (!series.length) return `<div class="panel" style="color:var(--muted)">All lines are hidden. Tap a card name to show it.</div>${legend}`;
  }
  const main = series[0].values, hiV = Math.max(...main), loV = Math.min(...main);
  const moves = main.slice(1).map((v, i) => usd ? pct(main[i], v) : v - main[i]);
  const bigI = moves.reduce((b, v, i) => Math.abs(v) > Math.abs(moves[b] || 0) ? i : b, 0);
  const stat = (k, v, c2) => `<div class="rs"><span>${k}</span><b class="num ${c2 || ''}">${v}</b></div>`;
  let gradeRow = '';
  if (state.pView === 'grades' && series.length === 2) {
    const [r2, g2] = series, ch = s2 => usd ? pct(s2.values[0], last(s2.values)) : last(s2.values) - s2.values[0];
    const t2 = cs.filter(c => (state.pType === 'All' || c.tags.includes(state.pType)));
    const pr0 = basket(t2.filter(isPSA), range), rr0 = basket(t2.filter(c => !isPSA(c)), range), gN = t2.filter(isPSA).length, rN = t2.filter(c => !isPSA(c)).length;
    const premAt = i => (pr0[i] / gN) / (rr0[i] / rN);
    gradeRow = `<div class="rstats">${stat('Raw now', fmt(last(r2.values)))}${stat('Raw change', fmtPct(ch(r2)), cls(ch(r2)))}${stat('PSA 10 now', fmt(last(g2.values)))}${stat('PSA 10 change', fmtPct(ch(g2)), cls(ch(g2)))}${stat('Premium now', premAt(n - 1).toFixed(1) + '×')}${stat('Premium at start', premAt(0).toFixed(1) + '×')}</div>`;
  }
  const statRow = state.pView === 'cards' ? '' : state.pView === 'grades' ? gradeRow : `<div class="rstats">
    ${stat('Start', fmt(main[0]))}${stat('Now', fmt(last(main)))}${stat('High', fmt(hiV))}${stat('Low', fmt(loV))}
    ${stat('Change', usd ? fmtPct(pct(main[0], last(main))) : fmtPct(last(main) - main[0]), cls(usd ? pct(main[0], last(main)) : last(main) - main[0]))}
    ${moves.length ? stat('Biggest month', `${labels[bigI + 1]} ${usd ? fmtPct(moves[bigI], false) : fmtPct(moves[bigI], false)}`, cls(moves[bigI])) : ''}
  </div>`;
  return `${lineChart('ch-player', { series, labels, fmt, events: evs, zero, h: 280, vol: state.pVol === 'on' ? vol : null, log, partial: PARTIAL, noData: Math.max(0, vol.findIndex(v => v > 0)) })}
    ${legend}
    ${evs.length ? eventLegend(evs.map(e => e.type)) : ''}
    ${statRow}
    <span style="font-size:12px;color:var(--faint)">${note}${state.pVol === 'on' ? ` Bars along the bottom show completed sales each month${PARTIAL ? `; ${esc(last(labels))} is the month so far` : ''}.` : ''}</span>`;
}

function marketTable(groups) {

    ${groups.map(g => { const pc = g.raw || g.psa, yr = pc.price; return `<tr><th scope="row"><a href="#card-${pc.id}">${esc(g.name)}</a><div class="gtags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></th>${cell(g.raw)}${cell(g.psa)}<td class="num">${g.prem ? g.prem.toFixed(1) + '×' : '—'}</td><td class="num ${cls(pct(yr[0], last(yr)))}">${fmtPct(pct(yr[0], last(yr)), false)}</td><td class="num">${Math.round(g.sales)}</td><td>${sparkline(yr, last(yr) >= yr[0] ? 'var(--up)' : 'var(--down)')}</td></tr>`; }).join('')}
  </tbody></table></div>`;

function marketCards(pid, p, cs) {
  const fc = pFiltered(cs);
  const groups = cardGroups(fc);
  const val = g => { const c = state.pGrade === 'PSA 10' ? (g.psa || g.raw) : (g.raw || g.psa); return last(c.price); };
  const chg = g => { const c = g.raw || g.psa; return monthChange(c); };
  const yr = g => { const c = g.raw || g.psa; return pct(c.price[0], last(c.price)); };
  const sorters = { 'value-desc': (a, b) => val(b) - val(a), 'value-asc': (a, b) => val(a) - val(b), 'gain': (a, b) => chg(b) - chg(a), 'drop': (a, b) => chg(a) - chg(b), 'year': (a, b) => yr(b) - yr(a), 'sales': (a, b) => b.sales - a.sales, 'premium': (a, b) => (b.prem || 0) - (a.prem || 0) };
  groups.sort(sorters[state.playerSort] || sorters['value-desc']);
  return `<div class="section">

function playerMarket(pid, p, cs) {

  const t = combined(cs, state.playerRange);
  const rl = state.playerRange === '1Y' ? 'year' : state.playerRange === '6M' ? '6 months' : '3 months';
  return `<div class="section">
      <h2>Card market</h2>

    <div class="panel section" id="pchart">
      <div class="row" style="align-items:baseline;gap:12px;flex-wrap:wrap"><span class="num ${cls(t.change)}" style="font-size:40px;font-weight:600;letter-spacing:-0.02em">${fmtPct(t.change)}</span><span style="color:var(--muted)">all ${esc(p.short)} cards over the last ${rl}, across ${cs.length} tracked prices</span></div>
      ${marketControls()}
      ${marketChart(pid, p, cs)}

}

      ${p.awards && p.awards.length ? `<div class="chips">${p.awards.map(([n, c]) => `<span class="tag">${esc(c ? c + ' ' : '')}${esc(n)}</span>`).join('')}</div>` : ''}

  const evs = p.events.filter(e => e.i >= off).map(e => ({ ...e, i: e.i - off }));
  const prices = slice(c.price, state.cardRange);
  const m = monthChange(c), y = pct(c.price[0], c.price[11]);
  const inCol = col().includes(c.id);
  const others = CARDS.filter(o => o.p === c.p && o.id !== c.id);
  return `<div class="view">
    <div class="section" style="padding-top:8px">
      <a href="#player-${c.p}" style="color:var(--muted);text-decoration:none;font-weight:600;font-size:14px">← ${esc(p.name)}</a>

        <div style="width:180px;max-width:100%;display:flex;flex-direction:column;gap:8px;flex-shrink:0">

          <label for="photo" class="btn" style="min-height:40px;font-size:13px;cursor:pointer">${memPhotos[c.id] ? 'Replace photo' : 'Add your photo'}</label>
          <input id="photo" type="file" accept="image/*" data-id="${c.id}" hidden>
          ${memPhotos[c.id] ? `<button type="button" class="btn" style="min-height:36px;font-size:12px" data-act="removePhoto" data-id="${c.id}">Use artwork instead</button>` : `<span style="font-size:11px;color:var(--faint);text-align:center">${repoImages[c.id] ? 'Card image from CardSight AI' : 'Artwork shown until a real image or your photo is added'}</span>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 260px">
          <span class="eyebrow">${esc(p.name)} · ${esc(p.sport)}</span>
          <h1 style="font-size:clamp(24px,4vw,34px)">${esc(c.name)}</h1>
          <div class="chips">${[c.detail, ...c.tags].map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div class="row" style="align-items:baseline;gap:14px"><span class="num" style="font-size:36px;font-weight:600">${moneyFull(last(c.price))}</span><span class="num ${cls(m)}" style="font-weight:600">${fmtPct(m)} this month</span>${hotRank(c.id) ? `<span class="hot">${FLAME_ICON}Top riser #${hotRank(c.id)}</span>` : coldRank(c.id) ? `<span class="cold">${SNOW_ICON}Biggest drop #${coldRank(c.id)}</span>` : ''}</div>
          <div class="row"><button type="button" class="btn ${inCol ? '' : 'primary'}" data-act="toggleCol" data-id="${c.id}">${inCol ? '✓ In your collection' : '+ Add to collection'}</button><button type="button" class="btn" data-act="compareThis" data-id="${c.id}">Compare with other cards</button><button type="button" class="btn" data-act="toggleWish" data-id="${c.id}">${wishlist().includes(c.id) ? '★ On your wishlist' : '☆ Add to wishlist'}</button></div>
        </div>
      </div>
    </div>
    <div class="why"><span class="eyebrow">Why it moved · auto-written</span><p>${esc(whyItMoved(c))}</p></div>

    <div class="panel section">

      ${lineChart('ch-card', { series: [{ name: 'Sale price', values: prices, color: 'var(--fg)', area: true }], labels, fmt: money, events: evs })}
      ${eventLegend(evs.map(e => e.type))}

      <div class="tiles">

        <div class="tile"><span class="k">1-year high</span><span class="v">${money(Math.max(...c.price))}</span></div>
        <div class="tile"><span class="k">1-year low</span><span class="v">${money(Math.min(...c.price))}</span></div>

}

function viewCompare() {
  const ids = state.compareIds.filter(id => CARD[id]);
  const metric = state.compareMetric, view = state.compareView, range = state.compareRange;
  const colors = ['var(--fg)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
  const dashes = ['', '6 4', '2 4', '10 3 2 3'];
  const usable = ids.filter(id => metric !== 'pop' || CARD[id].pop);
  const series = usable.map((id, k) => {
    const c = CARD[id]; let v = slice(c[metric], range);
    if (view === 'pct') v = v.map(x => pct(v[0] || 1, x));
    return { name: PLAYERS[c.p].short + ' · ' + c.name.slice(0, 4), values: v, color: colors[ids.indexOf(id)], dash: dashes[ids.indexOf(id)] };
  });
  const fmt = view === 'pct' ? v => fmtPct(v, false) : metric === 'price' ? money : v => Math.round(v).toLocaleString('en-US');
  const rows = [
    ['Price', 'Latest sale', c => last(c.price), money, null],
    ['1-year change', '', c => pct(c.price[0], c.price[11]), v => fmtPct(v, false), 'max'],
    ['Sales / month', 'How easy to buy or sell', c => avg(c.sales), v => v.toFixed(1).replace(/\.0$/, ''), 'max'],
    ['Graded population', 'Copies that exist at this grade', c => c.pop ? last(c.pop) : null, v => v.toLocaleString('en-US'), 'min'],
    ['Population growth', 'New graded copies, 1 year', c => c.pop ? pct(c.pop[0], c.pop[11]) : null, v => fmtPct(v, false), 'min'],
    ['Volatility', 'Average monthly swing', c => avg(c.price.slice(1).map((v, i) => Math.abs(pct(c.price[i], v)))), v => v.toFixed(1) + '%', 'min']
  ];
  const insight = (() => {
    if (ids.length < 2) return 'Add at least two cards to compare them.';
    const cs = ids.map(id => CARD[id]);
    if (metric === 'price') { const ch = cs.map(c => [c, pct(slice(c.price, range)[0], last(c.price))]).sort((a, b) => b[1] - a[1]); return `${PLAYERS[ch[0][0].p].name}'s card performed best over this period (${fmtPct(ch[0][1], false)}). ${PLAYERS[last(ch)[0].p].name}'s did worst (${fmtPct(last(ch)[1], false)}).`; }
    if (metric === 'sales') { const s = cs.map(c => [c, avg(slice(c.sales, range))]).sort((a, b) => b[1] - a[1]); return `${PLAYERS[s[0][0].p].name}'s card sells most often, about ${Math.round(s[0][1])} times a month. Cards that trade often react faster to news, in both directions.`; }
    const g = cs.filter(c => c.pop).map(c => [c, pct(slice(c.pop, range)[0], last(c.pop))]).sort((a, b) => b[1] - a[1]);
    return g.length ? `${PLAYERS[g[0][0].p].name}'s graded supply grew fastest (${fmtPct(g[0][1], false)}). More graded copies means more supply, which can cap prices.` : 'None of these cards are graded, so there is no population to compare.';
  })();
  return `<div class="view">
    <div class="section" style="padding-top:8px"><h1>Compare cards</h1><p class="lede">Put up to four cards on one chart and see how they stack up on price, sales and supply.</p></div>
    <div class="section">
      <div class="list">${ids.map((id, k) => { const c = CARD[id]; return `<div class="item"><svg width="28" height="10" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" stroke="${colors[k]}" stroke-width="3" stroke-linecap="round"${dashes[k] ? ` stroke-dasharray="${dashes[k]}"` : ''}/></svg><div class="main"><span class="title">${esc(c.name)}</span><span class="sub">${esc(PLAYERS[c.p].name)} · ${esc(c.detail)}</span></div><button type="button" class="btn" style="min-height:36px;padding:0 10px" data-act="removeCompare" data-id="${id}" aria-label="Remove ${esc(c.name)}">Remove</button></div>`; }).join('')}</div>
      ${ids.length < 4 ? `<label for="addCompare" class="row" style="gap:8px;font-size:14px;color:var(--muted)">Add a card
        <select id="addCompare" style="min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%">
          <option value="">Choose a card…</option>
          ${Object.keys(PLAYERS).filter(pid => CARDS.some(c => c.p === pid)).map(pid => `<optgroup label="${esc(PLAYERS[pid].name)}">${CARDS.filter(c => c.p === pid && !ids.includes(c.id)).map(c => `<option value="${c.id}">${esc(c.name)} · ${esc(c.detail)}</option>`).join('')}</optgroup>`).join('')}
        </select></label>` : ''}
    </div>
    <div class="panel section">
      <div class="row">${segBtns('compareMetric', [['price', 'Price'], ['sales', 'Sales volume'], ['pop', 'Population']], metric)}${segBtns('compareView', [['pct', '% change'], ['actual', 'Actual']], view)}${segBtns('compareRange', [['3M', '3M'], ['6M', '6M'], ['1Y', '1Y']], range)}</div>
      ${series.length ? lineChart('ch-compare', { series, labels: slice(MONTHS, range), fmt, zero: view === 'pct' }) : '<p class="lede">No data for this view.</p>'}
      ${metric === 'pop' && usable.length < ids.length ? '<span style="font-size:12px;color:var(--faint)">Raw cards have no graded population, so they are left off this view.</span>' : ''}
    </div>
    <div class="why"><span class="eyebrow">What this means</span><p>${esc(insight)}</p></div>
    ${ids.length ? `<div class="section"><h2>Side-by-side stats</h2><div class="tablebox"><table><thead><tr><th scope="col">Stat</th>${ids.map(id => `<th scope="col">${esc(PLAYERS[CARD[id].p].short)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([label, help, get, f, best]) => { const vals = ids.map(id => get(CARD[id])); const nums = vals.filter(v => v !== null); const b = best && nums.length > 1 ? (best === 'max' ? Math.max(...nums) : Math.min(...nums)) : null;
        return `<tr><th scope="row">${label}${help ? `<span class="help">${help}</span>` : ''}</th>${vals.map(v => `<td class="${v !== null && v === b ? 'best' : ''}">${v === null ? '—' : esc(f(v))}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div><span style="font-size:12px;color:var(--faint)">Brighter value = best of the group for that stat.</span></div>` : ''}
  </div>`;
}

function viewCollection() {
  const ids = col();
  if (!ids.length) return `<div class="view"><div class="section" style="padding-top:8px"><h1>My collection</h1></div>
    <div class="panel empty"><h2>No cards yet</h2><p class="lede" style="max-width:44ch">Add cards from any card page, or load three sample cards to see how tracking works. Your collection is saved in this browser.</p>
    <div class="row" style="justify-content:center"><button type="button" class="btn primary" data-act="sampleCol">Add 3 sample cards</button><a class="btn" href="#home">Browse players</a></div></div>${wishAndOffers()}</div>`;
  const cs = ids.map(id => CARD[id]);
  const total = cs.reduce((s, c) => s + last(c.price), 0);
  const prev = cs.reduce((s, c) => s + c.price[10], 0);
  const yearAgo = cs.reduce((s, c) => s + c.price[0], 0);
  const series = MONTHS.map((_, i) => cs.reduce((s, c) => s + c.price[i], 0));
  const best = [...cs].sort((a, b) => monthChange(b) - monthChange(a))[0];
  return `<div class="view">
    <div class="section" style="padding-top:8px"><h1>My collection</h1><p class="lede">${cs.length} cards · saved in this browser</p></div>
    <div class="panel section">
      <div class="row" style="align-items:baseline;gap:14px"><span class="num" style="font-size:40px;font-weight:600">${moneyFull(total)}</span><span class="num ${cls(pct(prev, total))}" style="font-weight:600">${fmtPct(pct(prev, total))} this month</span><span class="num ${cls(pct(yearAgo, total))}" style="font-weight:600">${fmtPct(pct(yearAgo, total))} this year</span></div>
      ${lineChart('ch-col', { series: [{ name: 'Collection value', values: series, color: 'var(--accent)', area: true }], labels: MONTHS, fmt: money, h: 200 })}
      <span style="font-size:13px;color:var(--muted)">Best performer this month: ${esc(best.name)} (${esc(PLAYERS[best.p].name)}), ${fmtPct(monthChange(best), false)}.</span>
    </div>
    <div class="section"><h2>Cards</h2>
      <div class="list">${cs.map(c => `<div class="row" style="gap:8px;flex-wrap:nowrap"><div style="flex:1;min-width:0">${cardItem(c)}</div><button type="button" class="btn" style="min-height:44px;padding:0 12px" data-act="toggleCol" data-id="${c.id}" aria-label="Remove ${esc(c.name)} from collection">Remove</button></div>`).join('')}</div>
    </div>
    ${wishAndOffers()}
  </div>`;
}

function offerHint() {

function ensureTrade(cid) {
  const c = collector(cid);
  if (!state.trade || state.trade.cid !== cid) state.trade = { cid, handle: c.handle, give: [], get: [], cashGive: 0, cashGet: 0 };
  return state.trade;
}
function suggestTrade(cid) {
  const c = collector(cid), t = ensureTrade(cid), m = matchFor(c);
  t.give = [...m.theyWant]; t.get = m.theyHave.map(x => x.id); t.cashGive = 0; t.cashGet = 0;
  if (!t.get.length) { const best = c.items.filter(x => x.status === 'trade').sort((a, b) => last(CARD[b.id].price) - last(CARD[a.id].price))[0]; if (best) t.get = [best.id]; }
  const diff = sideStats(t.get).val - sideStats(t.give).val;
  if (diff > 0) t.cashGive = Math.round(diff); else if (diff < 0) t.cashGet = Math.round(-diff);
}
function pickRow(cd, act, on, note, disabled) {

}

/* sample cards that make the matching demo work: some you own that collectors want, some on your wishlist that they have */
function sampleMatchCards() {
  const cs = collectors();
  const wanted = [...new Set(cs.flatMap(c => c.wants))];
  const offered = [...new Set(cs.flatMap(c => c.items.filter(x => x.status !== 'keep').map(x => x.id)))];
  const own = wanted.slice(0, 3), wish = offered.filter(id => !own.includes(id)).slice(0, 3);
  setCol([...new Set([...col(), ...own])]); setWish([...new Set([...wishlist(), ...wish])]);
}

function resizePhoto(file, cb) {
  if (!file || !/^image\//.test(file.type)) return;
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 640 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cb(cv.toDataURL('image/jpeg', 0.8)); }; img.src = fr.result; };
  fr.readAsDataURL(file);
}

  const al = getAlerts(); let hit = 0;
  al.forEach(a => { const c = CARD[a.card]; if (!c || a.fired) return; const v = last(c.price); if ((a.dir === 'below' && v <= a.price) || (a.dir === 'above' && v >= a.price)) { a.fired = new Date().toISOString().slice(0, 10); hit++; } });
  if (hit) { setList('pulled-alerts', al); toast(`${hit} price alert${hit > 1 ? 's' : ''} triggered. See the player page.`); }
}
const tone = t => t === 'up' ? 'ins-up' : t === 'down' ? 'ins-down' : 'ins-flat';
function insTile(label, value, note, t, help) {
  return `<div class="ins-tile ${tone(t)}"><span class="ins-k">${label}${help ? `<span class="ins-help" title="${esc(help)}" aria-label="${esc(help)}" tabindex="0">?</span>` : ''}</span><span class="ins-v">${value}</span><span class="ins-n">${note}</span></div>`;
}
function scoreRing(n, size = 132) {
  const r = 52, c = 2 * Math.PI * r, col = n >= 62 ? 'var(--up)' : n >= 45 ? '#FFD25E' : 'var(--down)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Pulled Score ${n} out of 100"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * n / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="30" fill="var(--fg)">${n}</text><text x="60" y="84" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="Inter Tight, sans-serif">of 100</text></svg>`;
}
function gradingCalc(cs) {
  const groups = cardGroups(cs).filter(g => g.raw && g.psa);
  if (!groups.length) return `<div class="panel ins-box"><h3 class="ins-h">Is it worth grading?</h3><p class="ins-p">Needs a card with both raw and PSA 10 prices.</p></div>`;
  const g = groups.find(x => x.id === state.gcCard) || [...groups].sort((a, b) => b.sales - a.sales)[0];
  const raw = last(g.raw.price), ten = last(g.psa.price), cost = +state.gcCost || 0, chance = clamp(+state.gcChance || 0, 0, 100) / 100;
  const gain = ten - raw - cost, ev = chance * (ten - raw) - cost, be = ten - raw > 0 ? cost / (ten - raw) * 100 : 100;
  const verdict = ev > raw * 0.25 ? ['Worth grading', 'ins-up'] : ev > 0 ? ['Maybe, if it looks clean', 'ins-flat'] : ['Probably not worth it', 'ins-down'];
  return `<div class="panel ins-box">
    <h3 class="ins-h">Is it worth grading?</h3>
    <label class="af"><span>Card</span><select id="gcCard" class="ins-sel">${groups.map(x => `<option value="${x.id}"${x.id === g.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
    <div class="gc-row"><div><span class="ins-k">Raw value</span><b class="num">${money(raw)}</b></div><div><span class="ins-k">PSA 10 value</span><b class="num">${money(ten)}</b></div></div>
    <div class="gc-row">
      <label class="af"><span>Grading + shipping cost ($)</span><input id="gcCost" type="number" min="0" step="1" inputmode="numeric" value="${cost}"></label>
      <label class="af"><span>Chance it gets a 10: <b id="gcChanceV">${Math.round(chance * 100)}%</b></span><input id="gcChance" type="range" min="0" max="100" step="5" value="${Math.round(chance * 100)}"></label>
    </div>
    <div class="gc-out ${verdict[1]}"><b>${verdict[0]}</b><span>If it gets a 10 you'd gain about <b class="num">${money(Math.max(0, gain))}</b>${gain < 0 ? ' (the cost is more than the jump)' : ''}. Counting the odds, the expected gain is <b class="num">${ev >= 0 ? money(ev) : '−' + money(-ev)}</b>. You break even if the chance of a 10 is above <b>${Math.min(100, Math.round(be))}%</b>.</span></div>
    <span class="ins-fine">Assumes a card that misses a 10 is worth about its raw price. Real odds depend on centering, corners and surface.</span>
  </div>`;
}
function alertsBox(cs) {
  const al = getAlerts().filter(a => cs.some(c => c.id === a.card));

    <h3 class="ins-h">Price alerts</h3>
    <label class="af"><span>Card</span><select id="alCard" class="ins-sel">${opts.map(c => `<option value="${c.id}"${c.id === sel.id ? ' selected' : ''}>${esc(c.name)} · ${esc(c.detail)} · ${money(last(c.price))}</option>`).join('')}</select></label>
    <div class="gc-row"><label class="af"><span>Tell me when it goes</span><select id="alDir" class="ins-sel"><option value="below">below</option><option value="above">above</option></select></label><label class="af"><span>Price ($)</span><input id="alPrice" type="number" min="1" step="1" inputmode="numeric" value="${Math.round(last(sel.price) * 0.9)}"></label></div>
    <button type="button" class="btn primary sm" data-act="addAlert">Set alert</button>
    ${al.length ? `<div class="al-list">${al.map(a => `<div class="al-row"><span>${esc(CARD[a.card].name)} · ${esc(CARD[a.card].detail)} <b>${a.dir} ${money(a.price)}</b></span>${a.fired ? `<span class="stag st-sale">Triggered ${esc(a.fired)}</span>` : '<span class="stag">Watching</span>'}<button type="button" class="linkbtn" data-act="delAlert" data-id="${a.id}" aria-label="Remove alert">Remove</button></div>`).join('')}</div>` : ''}
    <span class="ins-fine">Alerts are checked each time prices update. Phone and email alerts come with accounts.</span>
  </div>`;
}
function fairRanges(cs) {
  const groups = cardGroups(cs).sort((a, b) => b.sales - a.sales).slice(0, 6);
  const rng3 = c => { const v = c.price.slice(-4).filter((x, i, arr) => c.sales.slice(-4)[i] > 0); const xs = v.length ? v : c.price.slice(-3); return [Math.min(...xs), Math.max(...xs)]; };
  return `<div class="panel ins-box"><h3 class="ins-h">Fair price range</h3><p class="ins-p">Typical prices from recent months of sales. Paying near the low end is a good deal.</p>
    <div class="fr-list">${groups.map(g => `<div class="fr-row"><span class="fr-name">${esc(g.name)}</span>${[['Raw', g.raw], ['PSA 10', g.psa]].map(([l, c]) => { if (!c) return `<span class="fr-cell faint">${l} —</span>`; const [lo, hi] = rng3(c); const mf = v => v < 10000 ? moneyFull(v) : money(v); return `<span class="fr-cell"><span class="ins-k">${l}</span><b class="num">${lo === hi ? mf(lo) : mf(lo) + '–' + mf(hi)}</b></span>`; }).join('')}</div>`).join('')}</div></div>`;
}
function insightsSection(pid, p, cs) {

  const mom = d.now >= d.hi * 0.98 ? ['At a 12-month high', 'Prices are at their best level of the year.', 'up'] : d.now > d.avg3 && d.avg3 > d.avg12 ? ['Heating up', 'Above its 3-month and 12-month averages.', 'up'] : d.now < d.avg3 && d.avg3 < d.avg12 ? ['Cooling off', 'Below its 3-month and 12-month averages.', 'down'] : d.now > d.avg12 ? ['Holding up', 'Above its 12-month average, but cooler lately.', 'flat'] : ['Below average', 'Under its 12-month average.', 'down'];
  const risk = d.vol < 6 ? ['Steady', 'up'] : d.vol < 14 ? ['Moves some', 'flat'] : ['Wild swings', 'down'];

    </div>
    ${(() => { const sp = playerSupply(cs); if (!sp) return ''; const [l, t, n] = sp.read; return `<div class="panel ins-box"><h3 class="ins-h">Supply vs. demand</h3><b class="ins-big ${tone(t)}">${l}</b><p class="ins-p">${sp.count} copies of his tracked cards are listed on eBay right now, and about ${sp.per} sold last month. ${n}</p><span class="ins-fine">Open any card to see its cheapest listings.</span></div>`; })()}

/* ---------- what's happening now: plain-English situation report + recent news + what could move his cards ---------- */
let NEWS = {}, NEWS_UPDATED = '';
const NEWS_TAGS = [
  ['Injury', /injur|surgery|sprain|strain(?!ed)|torn|fracture|concussion|hamstring|ankle(?!-break)|\bknee\b|out for|ruled out|questionable|doubtful|injured list|\bIL\b|day-to-day|setback/i, 'down'],
  ['Suspension', /suspend|suspension/i, 'down'],
  ['Trade talk', /\btrade[ds]?\b|trading block|deadline deal|acquire/i, 'flat'],
  ['Contract', /contract|extension|re-sign|signs with|free agen|max deal/i, 'flat'],
  ['Award', /\bMVP\b|All-Star|Pro Bowl|All-Pro|Cy Young|Rookie of the|Player of the (Week|Month)|award|All-NBA/i, 'up'],
  ['Milestone', /record|career-high|milestone|\b\d{3,5}(st|nd|rd|th)\b|historic|first player|franchise record/i, 'up'],
  ['Big game', /\b([3-9]\d)[- ]point|\btouchdowns?\b|\bhomers?\b|home run|triple-double|walk-off|grand slam|game-winning|career night/i, 'up'],
  ['Retirement', /retire/i, 'flat'],
  ['Hall of Fame', /hall of fame/i, 'up']
];
function newsTag(a) { const t = a.title + ' ' + a.desc; const m = NEWS_TAGS.find(([, re]) => re.test(t)); return m ? { label: m[0], tone: m[2] } : null; }
function fmtDay(s) { if (!s) return ''; const d = new Date(s.length <= 10 ? s + 'T12:00:00' : s); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function situationSection(pid, p, cs) {
  const n = NEWS[pid] || {}, news = (n.news || []).slice(0, 4), lg = (typeof LEGENDS !== 'undefined' && LEGENDS[pid]) || null;
  const d = cs.length ? insightData(pid, p, cs) : null, perf = d ? performanceCheck(d, p) : null;
  const yearNow = new Date().getFullYear(), sents = [], watch = [];
  // status
  if (p.status !== 'active') {
    const hof = (p.awards || []).map(a => /Hall of Fame class of (\d{4})/.exec(a[0])).find(Boolean);
    sents.push(`${p.name} is retired${hof ? ` and was inducted into the Hall of Fame in ${hof[1]}` : ''}, so there are no games to move his cards. Demand comes from collectors who grew up watching him, legacy news and big auction sales.`);
    const yrs = p.rookieYear ? yearNow - p.rookieYear : 0;
    if (yrs && yrs % 5 === 0) watch.push(['up', `${yrs}-year anniversary of his rookie season this year`, 'Round-number anniversaries bring articles, documentaries and renewed buying.']);
    if (hof) { const hy = yearNow - +hof[1]; if (hy > 0 && hy % 5 === 0) watch.push(['up', `${hy} years since his Hall of Fame induction`, 'Anniversary coverage tends to lift interest.']); }
    watch.push(['flat', 'Record auction sales', 'A big sale of one of his top cards often lifts prices across his whole market.']);
    watch.push(['flat', 'Documentaries and media', 'New films, series and tributes have caused some of the biggest jumps for legends.']);
  } else if (p.injured || (p.note && p.note.kind === 'warn')) {
    sents.push(`${p.name} is currently ${p.note && p.note.title ? p.note.title.replace(/^Injury report:\s*/i, 'listed as ').replace(/\s*\(.*\)$/, '') : 'injured'}${p.note && p.note.text ? `: ${p.note.text.replace(/\s+$/, '').replace(/\.?$/, '.')}` : '.'} Injuries usually push card prices down until there's a clear return date.`);
    watch.push(['down', 'Injury updates', 'A return date or a setback can move his cards quickly in either direction.']);
  } else {
    sents.push(`${p.name} is healthy and active${p.team ? ` with the ${p.team}` : ''}.`);
  }
  if (perf && p.status === 'active') sents.push(perf.note);
  // market
  if (d) {
    const dir = v => Math.abs(v) < 1 ? 'about flat' : v >= 0 ? `up ${Math.abs(v).toFixed(0)}%` : `down ${Math.abs(v).toFixed(0)}%`;
    sents.push(`His cards are ${dir(d.ch1)} over the last month and ${dir(d.ch3)} over 3 months, with about ${d.perMonth} sales last month${d.prevAvg ? ` (${d.perMonth >= d.prevAvg ? 'busier' : 'quieter'} than usual)` : ''}.`);
    if (hotRank(cs.slice().sort((a, b) => monthChange(b) - monthChange(a))[0].id)) watch.push(['up', 'Hot streak', 'One of his cards is among the top risers this month. Momentum can attract more buyers, or cool off fast.']);
  }
  // next up
  if (n.nextGame && n.nextGame.name) { sents.push(`Next game: ${n.nextGame.name}${n.nextGame.date ? ` on ${fmtDay(n.nextGame.date)}` : ''}.`); watch.push(['flat', `Next game: ${n.nextGame.name}`, 'Big performances bring short spikes, especially in prime-time or playoff games.']); }
  upcomingEvents(p).slice(0, 2).forEach(e => watch.push(['flat', `${e.when}: ${e.t}`, 'Key dates on the calendar that usually move prices.']));
  const tagged = news.map(a => ({ a, tag: newsTag(a) }));
  const seenTags = new Set();
  tagged.forEach(({ tag }) => { if (tag && !seenTags.has(tag.label) && ['Trade talk', 'Contract', 'Suspension', 'Retirement'].includes(tag.label)) { seenTags.add(tag.label); watch.unshift([tag.tone, `${tag.label} in the news`, tag.label === 'Contract' ? 'New deals and free agency change where he plays, which can widen or shrink his buyer base.' : tag.label === 'Trade talk' ? 'A move to a bigger market or a contender usually lifts demand.' : tag.label === 'Suspension' ? 'Missed games and bad headlines usually weigh on prices.' : 'Retirement talk often brings a wave of legacy buying.']); } });
  const arrow = t => t === 'up' ? '▲' : t === 'down' ? '▼' : '◆';
  return `<div class="sit">
    <div class="sit-head"><span class="eyebrow">What's happening now</span>${NEWS_UPDATED ? `<span class="sit-upd">Updated ${esc(fmtDay(NEWS_UPDATED))}</span>` : ''}</div>
    <p class="sit-sum">${sents.map(esc).join(' ')}</p>
    ${n.note && (n.note.headline || n.note.story) ? `<div class="sit-note"><b>${esc(n.note.headline || 'Latest update')}</b>${n.note.story ? `<span>${esc(n.note.story)}</span>` : ''}${n.note.date ? `<span class="sit-date">${esc(fmtDay(n.note.date))}</span>` : ''}</div>` : ''}
    <div class="sit-cols">
      <div class="sit-box"><h3>Recent news</h3>${tagged.length ? `<div class="sit-news">${tagged.map(({ a, tag }) => `<a class="sit-item"${a.url ? ` href="${esc(a.url)}" target="_blank" rel="noopener"` : ''}>${tag ? `<span class="stag sit-${tag.tone}">${esc(tag.label)}</span>` : ''}<b>${esc(a.title)}</b>${a.desc && a.desc.toLowerCase() !== a.title.toLowerCase() ? `<span class="sit-desc">${esc(a.desc)}</span>` : ''}<span class="sit-date">${esc(fmtDay(a.date))}${a.url ? ' · ESPN' : ''}</span></a>`).join('')}</div>` : `<p class="ins-p">${p.status === 'active' ? 'No headlines in the last few days.' : 'No recent headlines. For retired players, quiet news is normal.'}</p>`}</div>
      <div class="sit-box"><h3>What could move his cards next</h3><div class="sit-watch">${watch.slice(0, 5).map(([t, h, s]) => `<div class="sit-w"><span class="sit-ar sit-${t}" aria-hidden="true">${arrow(t)}</span><div><b>${esc(h)}</b><span>${esc(s)}</span></div></div>`).join('')}</div></div>
    </div>
  </div>`;
}

/* ---------- live eBay listings (data/listings.json, from the eBay Browse API robot) ---------- */
let LISTINGS = {}, LISTINGS_UPDATED = '';
function listingFor(c) { const L = LISTINGS[baseId(c)]; return L ? L[isPSA(c) ? 'psa10' : 'raw'] : null; }
function supplyRead(count, perMonth) {
  if (!perMonth) return count ? ['Plenty listed, few sales', 'flat', 'Copies are listed but rarely sell, so buyers have leverage.'] : ['No listings, no sales', 'flat', 'Very little market activity right now.'];
  const m = count / perMonth;
  return m < 1 ? ['Tight supply', 'up', `About ${m.toFixed(1)} months of listings at the current sales pace. Tight supply tends to push prices up.`]
    : m <= 3 ? ['Balanced', 'flat', `About ${m.toFixed(1)} months of listings at the current sales pace.`]
    : ['Lots of supply', 'down', `About ${m.toFixed(1)} months of listings at the current sales pace. Heavy supply tends to hold prices down.`];
}
function listingPanel(c) {
  const L = listingFor(c); if (!L) return '';
  const mk = last(c.price), si = PARTIAL ? 2 : 1, per = c.sales[c.sales.length - si] || 0, [lab, t, note] = supplyRead(L.count, per);
  const vs = L.typical ? pct(mk, L.typical) : null;
  return `<div class="panel ins-box" id="listings">
    <div class="row between"><h3 class="ins-h">On eBay right now</h3><span class="sit-upd">${LISTINGS_UPDATED ? 'Updated ' + esc(fmtDay(LISTINGS_UPDATED)) : ''}</span></div>
    ${L.count ? `<div class="tiles"><div class="tile"><span class="k">Listed</span><span class="v">${L.count}</span>${L.auctions ? `<span class="k">${L.auctions} auction${L.auctions > 1 ? 's' : ''}</span>` : ''}</div><div class="tile"><span class="k">Lowest ask</span><span class="v">${money(L.low)}</span></div><div class="tile"><span class="k">Typical ask</span><span class="v">${money(L.typical)}</span>${vs != null ? `<span class="k">${Math.abs(vs) < 3 ? 'about market value' : `${Math.abs(vs).toFixed(0)}% ${vs > 0 ? 'above' : 'below'} market`}</span>` : ''}</div><div class="tile"><span class="k">Supply</span><span class="v" style="font-size:16px">${lab}</span></div></div>
      <p class="ins-p">${esc(note)}</p>
      <div class="sit-news">${L.cheapest.map(x => `<a class="sit-item" href="${esc(x.url)}" target="_blank" rel="noopener sponsored"><b>${money(x.price)}${x.auction ? ' · auction' : ''}</b><span class="sit-desc">${esc(x.title)}</span><span class="sit-date">View on eBay${x.ends && x.auction ? ' · ends ' + esc(fmtDay(x.ends)) : ''}</span></a>`).join('')}</div>`
      : '<p class="ins-p">No matching listings on eBay right now.</p>'}
    <span class="ins-fine">Asking prices from active eBay listings that match this card. Asking prices are often higher than what cards actually sell for.</span>
  </div>`;
}
function playerSupply(cs) {
  const si = PARTIAL ? 2 : 1; let count = 0, per = 0, any = false;
  cs.forEach(c => { const L = listingFor(c); if (L) { any = true; count += L.count; per += c.sales[c.sales.length - si] || 0; } });
  return any ? { count, per, read: supplyRead(count, per) } : null;
}

/* ---------- accounts & shared data (Supabase) ----------

async function verifyCert(raw) {

      if (!code && ctx && ctx.status === 404) return { err: "PSA checks aren't switched on yet." };
      return { err: (PSA_ERR[code] || PSA_ERR.psa) + (ps ? ` (PSA code ${ps})` : '') };
