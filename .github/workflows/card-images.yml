name: Fetch card images

# Run by hand: GitHub repo -> Actions tab -> "Fetch card images" -> Run workflow.
# Needs a repository secret named CARDSIGHTAI_API_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the CardSight SDK
        run: pip install cardsightai

      - name: Download card images
        env:
          CARDSIGHTAI_API_KEY: ${{ secrets.CARDSIGHTAI_API_KEY }}
          PULLED_IMAGE_DIR: images/cards
        run: python tools/get_card_images.py

      - name: Save images to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          git add images/cards
          if git diff --cached --quiet; then
            echo "No new or changed images."
          else
            git commit -m "Update card images from CardSight AI"
            git push
          fi
