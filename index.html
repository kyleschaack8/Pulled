  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  if (a.dataset.act === 'authMode') { const st = state.auth, em = document.getElementById('auEmail'), hd = document.getElementById('auHandle'); if (em) st.email = em.value; if (hd) st.handle = hd.value; st.mode = id; st.err = ''; st.msg = ''; if (location.hash !== '#login') return; render(); const f = document.getElementById('auEmail'); if (f && f.focus) f.focus(); return; }
  if (a.dataset.act === 'signOut') { signOut(); return; }
  if (a.dataset.act === 'psaCheck') { psaCheck(); return; }
  if (a.dataset.act === 'psaUse') { psaUse(); return; }
  if (a.dataset.act === 'delPost') { if (isCloudPost(id)) cloudDeletePost(id); return; }
  if (a.dataset.act === 'follow' && CLOUD.users[id]) { cloudFollow(id); return; }
  if (a.dataset.act === 'like' && isCloudPost(id)) { cloudLike(id); return; }
  if ((a.dataset.act === 'subApprove' || a.dataset.act === 'subReject') && CLOUD.ok) { cloudReview(id, a.dataset.act === 'subApprove' ? 'approved' : 'rejected'); return; }
  if (a.dataset.act === 'follow') { const was = isFollowing(id); toggleFollow(id); toast(was ? 'Unfollowed' : 'Following @' + (collector(id) || {}).handle); render(); }
  if (a.dataset.act === 'like') { memLikes = memLikes.includes(id) ? memLikes.filter(x => x !== id) : [...memLikes, id]; setList('pulled-likes', memLikes); render(); }
  if (a.dataset.act === 'comments') { state.openComments = state.openComments === id ? null : id; render(); const n = document.getElementById('cmt-' + id); if (n && state.openComments === id) n.focus(); }
  if (a.dataset.act === 'addComment') addComment(id);
  if (a.dataset.act === 'feedMore') { state.feedLimit += 10; render(); }
  if (a.dataset.act === 'sendMsg') sendMsg(id);
  if (a.dataset.act === 'draftKind') { state.draft = { ...state.draft, kind: id }; render(); }
  if (a.dataset.act === 'publishPost') publishPost();
  if (a.dataset.act === 'addAlert') { const c = $('#alCard'), d = $('#alDir'), pr = $('#alPrice'); const price = Math.round(+(pr && pr.value) || 0); if (c && price > 0) { const al = getAlerts(); al.unshift({ id: 'a-' + Date.now(), card: c.value, dir: d ? d.value : 'below', price }); setList('pulled-alerts', al.slice(0, 50)); toast('Alert set'); render(); } }
  if (a.dataset.act === 'delAlert') { setList('pulled-alerts', getAlerts().filter(x => x.id !== id)); render(); }
  if (a.dataset.act === 'addStep') { state.add.step = +id; render(); }
  if (a.dataset.act === 'addClear') { state.add[id] = null; if (id === 'front') { state.addOcrSrc = null; state.add.step = 1; } render(); }
  if (a.dataset.act === 'addToggle') { state.add[id] = !state.add[id]; render(); }
  if (a.dataset.act === 'readCard') readCard();
  if (a.dataset.act === 'addMatch') { if (!col().includes(id)) setCol([...col(), id]); state.draft = { card: id, kind: state.add.psaCert ? 'graded' : 'pulled', caption: '', ask: '', photo: state.add.front, cert: state.add.psaCert || '' }; state.psa = { cert: '', busy: false, res: null, err: '' }; state.add = D0(); state.addOcrSrc = null; toast('Added to My collection. Share it?'); location.hash = 'post'; }
  if (a.dataset.act === 'submitCard') submitCard();
  if (a.dataset.act === 'subApprove' || a.dataset.act === 'subReject') { const s = memSubs.find(x => x.id === id); if (s) { s.status = a.dataset.act === 'subApprove' ? 'approved' : 'rejected'; saveSubs(); toast(s.status === 'approved' ? 'Approved' : 'Rejected'); render(); } }
  if (a.dataset.act === 'browsePlayer') { const pl = PLAYERS[id]; if (pl) { state.f = { ...F0(), player: [pl.name], view: state.f.view || 'grid' }; state.fLimit = 48; state.fOpen = false; } if (location.hash === '#browse') render(); }
  if (a.dataset.act === 'toChart') { state.playerRange = '1Y'; state.pView = 'index'; render(); const el = document.getElementById('pchart'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  if (a.dataset.act === 'pHide') { state.pHidden = { ...state.pHidden, [id]: !state.pHidden[id] }; render(); }
  if (a.dataset.act === 'pReset') { state.pGrade = 'All'; state.pType = 'All'; state.pQuery = ''; state.pHidden = {}; render(); }
  if (a.dataset.act === 'toggleCol') { const ids = col(); const has = ids.includes(id); setCol(has ? ids.filter(x => x !== id) : [...ids, id]); toast(has ? 'Removed from your collection' : 'Added to your collection'); render(); }
  if (a.dataset.act === 'sampleCol') { setCol([...CARDS].sort((x, y) => avg(y.sales) - avg(x.sales)).slice(0, 3).map(c => c.id)); toast('Added 3 sample cards'); render(); }
  if (a.dataset.act === 'fToggle') { const k = a.dataset.k, v = a.dataset.v, arr = state.f[k]; state.f[k] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; state.fLimit = 48; render(); }
  if (a.dataset.act === 'fMore') { state.fMore[a.dataset.k] = !state.fMore[a.dataset.k]; render(); }
  if (a.dataset.act === 'fPrice') { const same = state.f.pmin === a.dataset.lo && state.f.pmax === a.dataset.hi; state.f.pmin = same ? '' : a.dataset.lo; state.f.pmax = same ? '' : a.dataset.hi; state.fLimit = 48; render(); }
  if (a.dataset.act === 'fClearPrice') { state.f.pmin = ''; state.f.pmax = ''; render(); }
  if (a.dataset.act === 'fClearSales') { state.f.minSales = '0'; render(); }
  if (a.dataset.act === 'fClearQ') { state.f.q = ''; render(); }
  if (a.dataset.act === 'fReset') { const keep = { sort: state.f.sort, view: state.f.view }; state.f = { ...F0(), ...keep }; state.fLimit = 48; render(); }
  if (a.dataset.act === 'fOpen') { state.fOpen = !state.fOpen; render(); }
  if (a.dataset.act === 'fMoreRes') { state.fLimit += 48; render(); }
  if (a.dataset.act === 'fView') { state.f.view = a.dataset.v; render(); }
  if (a.dataset.act === 'toggleWish') { const w = wishlist(), has = w.includes(id); setWish(has ? w.filter(x => x !== id) : [...w, id]); toast(has ? 'Removed from your wishlist' : 'Added to your wishlist'); render(); }
  if (a.dataset.act === 'sampleMatch') { sampleMatchCards(); toast('Added sample cards to your collection and wishlist'); render(); }
  if (a.dataset.act === 'suggest') { suggestTrade(id); if (!a.getAttribute('href')) render(); }
  if (a.dataset.act === 'tradeFor') { const t = ensureTrade(a.dataset.cid); if (!t.get.includes(id)) t.get = [...t.get, id]; }
  if (a.dataset.act === 'tgGive' || a.dataset.act === 'tgGet') { const t = state.trade, k = a.dataset.act === 'tgGive' ? 'give' : 'get'; if (t) { t[k] = t[k].includes(id) ? t[k].filter(x => x !== id) : [...t[k], id]; render(); } }
  if (a.dataset.act === 'offerOpen') { state.offerFor = { cid: a.dataset.cid, card: id }; if (!a.getAttribute('href')) { render(); const p = document.getElementById('offerPanel'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'start' }); } }
  if (a.dataset.act === 'offerClose') { state.offerFor = null; render(); }
  if (a.dataset.act === 'offerSend' || a.dataset.act === 'buyNow') {
    const c = collector(a.dataset.cid), x = c && c.items.find(i => i.id === id), amt = a.dataset.act === 'buyNow' ? x.ask : Math.round(+(($('#offerAmt') || {}).value) || 0);
    if (!amt) { toast('Enter an offer amount'); return; }
    addOffer({ type: a.dataset.act === 'buyNow' ? 'buy-now' : 'buy', cid: c.id, card: id, amount: amt });
    state.offerFor = null; toast(a.dataset.act === 'buyNow' ? 'Saved. Checkout arrives with payments.' : `Offer of ${money(amt)} saved to My collection`); render();
  }
  if (a.dataset.act === 'sendTrade') { const t = state.trade; if (t) { addOffer({ type: 'trade', cid: t.cid, give: [...t.give], get: [...t.get], cashGive: +t.cashGive || 0, cashGet: +t.cashGet || 0 }); toast('Trade offer saved to My collection'); state.trade = null; location.hash = 'collection'; } }

  if (a.dataset.act === 'removePhoto') { setPhoto(id, null); toast('Showing artwork'); render(); }
  if (a.dataset.act === 'removeCompare') { state.compareIds = state.compareIds.filter(x => x !== id); render(); }
  if (a.dataset.act === 'compareThis') { if (!state.compareIds.includes(id)) state.compareIds = [id, ...state.compareIds.filter(x => x !== id)].slice(0, 4); else state.compareIds = [id, ...state.compareIds.filter(x => x !== id)]; location.hash = 'compare'; }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('submit', e => { const f = e.target; if (!f || !f.id) return; if (f.id === 'authForm') { e.preventDefault(); doAuth(); } if (f.id === 'acctForm') { e.preventDefault(); saveAccount(); } });
render();
loadRepoImages();
loadRealData().finally(() => initCloud());
</script>
</body>
