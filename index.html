<style>
/* Layout: one app shell, sticky top bar, single content column up to 1120px; views swap by hash. Single dark look by design. */
:root {
  --bg: #0A0C10;
  --surface: #12161E;
  --raise: #1A1F29;
  --line: #262C38;
  --fg: #F2F4F8;
  --muted: #A3AAB8;
  --faint: #8D94A3;
  --accent: #C6F432;
  --accent-ink: #0A0C10;
  --up: #4ADE80;
  --down: #FF7A66;
  --game: #F59E3B;
  --news: #7EA2FF;
  --s2: #7EA2FF;
  --s3: #F59E3B;
  --s4: #E879F9;
  --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--fg); text-decoration: none; }
.brand span { color: var(--accent); }
.gsearch { position: relative; flex: 1 1 260px; max-width: 440px; min-width: 0; }
.gsearch > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.gsearch input { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 40px; font-size: 15px; }
.gsearch input:focus { border-color: var(--faint); }
.gresults { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.45); max-height: min(70vh, 520px); overflow-y: auto; padding: 6px; }
.gresults .ghead { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; }
.gres { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); min-height: 44px; }
.gres[aria-selected="true"], .gres:hover { background: var(--raise); }
.gres .gm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gres .gt { font-weight: 700; font-size: 14px; }
.gres .gs { font-size: 12px; color: var(--faint); }
.gres .gthumb { display: block; width: 30px; height: 42px; flex-shrink: 0; overflow: hidden; }
.gres .gbadge { width: 30px; height: 30px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: var(--muted); flex-shrink: 0; }
.gres mark { background: none; color: var(--accent); }
.gempty { padding: 14px 10px; color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) { .gsearch { order: 3; flex-basis: 100%; max-width: none; } }
/* Hot cards: fire glow on the top risers */
.flame { position: relative; isolation: isolate; border-radius: 7px; }
.flame::before { content: ""; position: absolute; inset: -4px; border-radius: 9px; z-index: -1; pointer-events: none;
  background: linear-gradient(0deg, #ff2d00 0%, #ff7a00 40%, #ffc400 75%, rgba(255,196,0,0) 100%); filter: blur(5px); opacity: .9;
  transform-origin: 50% 100%; animation: flicker 1.4s ease-in-out infinite alternate; }
.flame::after { content: ""; position: absolute; inset: -1px; border-radius: 8px; pointer-events: none;
  box-shadow: 0 0 0 1.5px #ff8a00, 0 -3px 12px 2px rgba(255,110,0,.55); animation: glow 1.1s ease-in-out infinite alternate; }
.flame.big::before { inset: -8px; filter: blur(10px); border-radius: 14px; }
.flame.big::after { border-radius: 12px; }
.flame .tongues { position: absolute; left: -6%; right: -6%; width: 112%; top: -15%; height: 22%; z-index: -1; pointer-events: none; overflow: visible; }
.flame .tongues path { transform-box: fill-box; transform-origin: 50% 100%; animation: tongue 1s ease-in-out infinite alternate; }
.flame .tongues path:nth-child(2n) { animation-duration: .8s; animation-delay: -.3s; }
.flame .tongues path:nth-child(3n) { animation-duration: 1.25s; animation-delay: -.6s; }
@keyframes flicker { 0% { transform: scaleY(1); opacity: .75; } 35% { transform: scaleY(1.07) translateY(-2px); opacity: .95; } 70% { transform: scaleY(.98); opacity: .82; } 100% { transform: scaleY(1.12) translateY(-3px); opacity: 1; } }
@keyframes glow { from { box-shadow: 0 0 0 1.5px #ff8a00, 0 -2px 9px 1px rgba(255,90,0,.45); } to { box-shadow: 0 0 0 1.5px #ffb300, 0 -5px 18px 4px rgba(255,140,0,.7); } }
@keyframes tongue { 0% { transform: scaleY(.65) skewX(-4deg); opacity: .8; } 50% { transform: scaleY(1.05) skewX(3deg); opacity: 1; } 100% { transform: scaleY(.85) skewX(-2deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .flame::before, .flame::after, .flame .tongues path { animation: none; } }
.hot { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; color: #1a0800; background: linear-gradient(90deg, #ffb300, #ff6a00); flex-shrink: 0; }

main { padding-block: 8px 72px; }
.view { display: flex; flex-direction: column; gap: 28px; }
h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.section { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }

.list { display: flex; flex-direction: column; gap: 8px; }

.alert.info { border-color: color-mix(in srgb, var(--news) 45%, var(--line)); background: color-mix(in srgb, var(--news) 8%, var(--surface)); }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: none; background: var(--raise); font-size: 12px; color: var(--muted); }

.check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-top: 1px solid var(--line); }
.check:first-child { border-top: none; }
.dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; border: 2px solid var(--line); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }

</style>

/* Ignore a month whose price is 3x above/below the recent typical price when it rests on only 1-2 sales
   (usually a mislabeled parallel, auto or damaged copy). */
function cleanSeries(med, cnt) {
  const out = med.slice();
  for (let i = 0; i < out.length; i++) {
    if (out[i] == null || (cnt[i] || 0) > 2) continue;
    const prev = out.slice(0, i).filter(v => v != null).slice(-3).sort((a, b) => a - b);
    if (prev.length < 2) continue;
    const ref = prev[Math.floor(prev.length / 2)];
    if (out[i] > ref * 3 || out[i] < ref / 3) out[i] = null;
  }
  return out;
}
function fillSeries(med) {
  const first = med.find(v => v != null);
  if (first == null) return null;
  let prev = first;
  return med.map(v => (v == null ? prev : (prev = v)));
}

/* Fill a player's team, number, stats, awards and injury status from data/stats.json */
function applyStats(P, s, p) {
  if (!s) return;
  if (s.team) P.team = s.team;
  if (s.teamAbbr) P.teamAbbr = s.teamAbbr;
  P.color = teamAccent(s.teamColor, s.teamAlt);
  if (s.jersey) P.num = '#' + s.jersey;
  if (s.position) P.pos = s.position;
  if (s.summary && s.summary.stats && s.summary.stats.length) {
    P.stats = s.summary.stats.map(([k, v, r]) => [k, v, r]);
    P.statsLabel = s.summary.label.replace(/^\w/, c => c.toUpperCase());
  } else if (s.career && s.career.length) {
    P.stats = s.career.slice(0, 4).map(([k, v]) => [k, v, '']);
    P.statsLabel = 'Career';
  }
  const rows = [['This season', s.season], ['Last 5 games', s.last5], ['Projected', s.projected], ['Career', s.career]].filter(([, v]) => v && v.length);
  if (rows.length) {
    const cols = rows[0][1].map(([k]) => k);
    P.table = { cols, rows: rows.map(([label, v]) => [label, cols.map(c => (v.find(([k]) => k === c) || [c, '—'])[1])]) };
    if (s.statsLabel) P.tableLabel = s.statsLabel;
  }
  P.awards = (s.awards || []).filter(a => a[0]);
  P.extra = [s.experience, s.draft ? 'Drafted ' + s.draft : ''].filter(Boolean).join(' · ');
  if (s.injury && s.injury.status) {
    const back = s.injury.returnDate ? ` Expected back around ${s.injury.returnDate}.` : '';
    const serious = !/rest|day-to-day/i.test(s.injury.status + ' ' + s.injury.type);
    P.note = { kind: 'warn', title: `Injury report: ${s.injury.status}${s.injury.type ? ' (' + s.injury.type + ')' : ''}`, text: (s.injury.comment || '') + back };
    P.injured = serious ? s.injury.status : '';
  } else if (p.status === 'active') {
    P.note = { kind: 'info', title: 'Injury report', text: 'No current injury designation.' };
  } else {
    P.note = { kind: 'info', title: 'Legacy', text: P.awards.length ? 'Career honors are listed above. Legacy events like Hall of Fame news and anniversaries can move these cards.' : 'Retired players have no live games, so their cards move on legacy news, anniversaries and nostalgia.' };
  }
}

/* combined player trend: % change weighted by how often each card sells */
function playerTrend(pid, range) {
  const cs = CARDS.filter(c => c.p === pid);
  return combined(cs, range);
}
function combined(cs, range) {
  const n = RANGES[range];
  if (!cs.length) return { series: new Array(n).fill(0), change: 0 };
  const w = cs.map(c => Math.max(0.5, avg(slice(c.sales, range))));
  const W = w.reduce((a, b) => a + b, 0);
  const series = [];
  for (let t = 0; t < n; t++) {
    let s = 0;
    cs.forEach((c, k) => { const p = slice(c.price, range); s += w[k] * pct(p[0], p[t]); });
    series.push(s / W);
  }
  return { series, change: last(series) };
}

function whyItMoved(c) {

  const m = monthChange(c), y = pct(c.price[0], c.price[11]);
  const dir = m > 0.05 ? 'Up' : m < -0.05 ? 'Down' : 'Flat';
  const recent = p.events.filter(e => e.i >= 9).slice(-1)[0];
  const salesNow = c.sales[11], salesAvg = avg(c.sales.slice(0, 11));
  let s = `${dir} ${fmtPct(Math.abs(m), false).replace('+', '')} this month`;
  if (recent) s += `, following "${recent.label}" (${MONTHS[recent.i]})`;
  s += '. ';
  if (salesAvg > 0 && salesNow > salesAvg * 1.3) s += `Sales picked up to ${salesNow} this month, well above the usual ${Math.round(salesAvg)}. `;
  else if (salesAvg > 0 && salesNow < salesAvg * 0.7) s += `Fewer copies sold than usual, so prices can swing on just a few sales. `;
  s += `Over the past year it is ${y >= 0 ? 'up' : 'down'} ${Math.abs(y).toFixed(0)}%.`;
  if (p.status === 'retired') s += ' As a retired player, his cards move on legacy news, not games.';
  return s;
}

function lineChart(id, { series, labels, fmt, events = [], h = 240, zero = false }) {

  const y = v => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB);
  const ticks = [hi - pad, (hi + lo) / 2, lo + pad];
  let g = '';
  ticks.forEach(t => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${esc(fmt(t))}</text>`; });
  if (zero && lo < 0 && hi > 0) g += `<line x1="${padL}" x2="${W - padR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>`;
  labels.forEach((l, i) => { if (n <= 7 || i % 2 === 0 || i === n - 1) g += `<text x="${x(i).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${esc(l)}</text>`; });
  events.forEach(e => {
    const col = e.type === 'game' ? 'var(--game)' : e.type === 'injury' ? 'var(--down)' : 'var(--news)';
    const ex = x(e.i);
    g += `<line x1="${ex}" x2="${ex}" y1="${padT}" y2="${h - padB}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    g += e.type === 'injury'
      ? `<rect x="${ex - 5}" y="${padT - 5}" width="10" height="10" fill="${col}" transform="rotate(45 ${ex} ${padT})"/>`
      : e.type === 'game' ? `<circle cx="${ex}" cy="${padT}" r="5.5" fill="${col}"/>` : `<rect x="${ex - 5}" y="${padT - 5}" width="10" height="10" rx="2" fill="${col}"/>`;
  });
  series.forEach(s => {
    const d = s.values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    if (s.area) g += `<path d="${d} L${x(n - 1).toFixed(1)} ${h - padB} L${padL} ${h - padB} Z" fill="${s.color}" fill-opacity="0.08"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`;
    g += `<circle cx="${x(n - 1).toFixed(1)}" cy="${y(last(s.values)).toFixed(1)}" r="4" fill="${s.color}"/>`;
  });
  g += `<line class="guide" x1="0" x2="0" y1="${padT}" y2="${h - padB}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect class="hit" x="${padL}" y="0" width="${W - padL - padR}" height="${h}" fill="transparent"/>`;
  charts[id] = { series, labels, fmt, events, x, W, padL, padR, n };
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))} over ${labels[0]} to ${last(labels)}">${g}</svg><div class="tip" hidden></div></div>`;
}
function wireCharts() {
  Object.keys(charts).forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    const c = charts[id], svg = el.querySelector('svg'), hit = el.querySelector('.hit'), guide = el.querySelector('.guide'), tip = el.querySelector('.tip');
    function show(evt) {
      const r = svg.getBoundingClientRect();
      const px = (evt.clientX - r.left) / r.width * c.W;
      let i = Math.round((px - c.padL) / ((c.W - c.padL - c.padR) / Math.max(1, c.n - 1)));
      i = Math.max(0, Math.min(c.n - 1, i));
      const gx = c.x(i);
      guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('visibility', 'visible');
      const ev = c.events.filter(e => e.i === i);
      tip.innerHTML = `<div class="t">${esc(c.labels[i])}</div>` + c.series.map(s => `<div class="l"><span style="color:${s.color}">${esc(s.name)}</span><span class="num">${esc(c.fmt(s.values[i]))}</span></div>`).join('') + ev.map(e => `<div style="margin-top:4px;color:var(--muted)">${esc(e.label)}</div>`).join('');
      tip.hidden = false;
      const left = Math.min(Math.max(gx / c.W * r.width, 80), r.width - 80);
      tip.style.left = left + 'px';
    }
    hit.addEventListener('mousemove', show);
    hit.addEventListener('touchstart', e => show(e.touches[0]), { passive: true });
    hit.addEventListener('mouseleave', () => { tip.hidden = true; guide.setAttribute('visibility', 'hidden'); });
  });
}
function barChart(values, labels, color) {

function hexRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function teamAccent(primary, alt) {

function handlePhoto(file, id) {

    const img = new Image();
    img.onload = () => {
      const max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);

/* ---------- hot cards: top 5 risers this month (10%+ on 3+ recent sales) ---------- */

    const rows = CARDS.map(c => ({ id: c.id, ch: monthChange(c), s: (c.sales[10] || 0) + (c.sales[11] || 0) }))

      <div class="alert ${p.note.kind}"><div><div style="font-weight:700">${esc(p.note.title)}</div><div style="color:var(--muted);font-size:14px">${esc(p.note.text)}</div></div></div>

    <div class="section"${cs.length ? '' : ' hidden'}>

        <label class="row" style="gap:8px;font-size:13px;color:var(--muted)" for="sort">Sort
          <select id="sort" style="min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px">
            ${[['value-desc', 'Value: high to low'], ['value-asc', 'Value: low to high'], ['gain', 'Biggest gain (1M)'], ['drop', 'Biggest drop (1M)']].map(([v, l]) => `<option value="${v}"${v === state.playerSort ? ' selected' : ''}>${l}</option>`).join('')}

}

  const m = monthChange(c), y = pct(c.price[0], c.price[11]);

  return `<div class="view">

          <input id="photo" type="file" accept="image/*" data-id="${c.id}" hidden>

        </div>

function viewCompare() {
  const ids = state.compareIds.filter(id => CARD[id]);
  const metric = state.compareMetric, view = state.compareView, range = state.compareRange;
  const colors = ['var(--fg)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
  const dashes = ['', '6 4', '2 4', '10 3 2 3'];
  const usable = ids.filter(id => metric !== 'pop' || CARD[id].pop);
  const series = usable.map((id, k) => {
    const c = CARD[id]; let v = slice(c[metric], range);
    if (view === 'pct') v = v.map(x => pct(v[0] || 1, x));
    return { name: PLAYERS[c.p].short + ' · ' + c.name.slice(0, 4), values: v, color: colors[ids.indexOf(id)], dash: dashes[ids.indexOf(id)] };
  });
  const fmt = view === 'pct' ? v => fmtPct(v, false) : metric === 'price' ? money : v => Math.round(v).toLocaleString('en-US');
  const rows = [
    ['Price', 'Latest sale', c => last(c.price), money, null],
    ['1-year change', '', c => pct(c.price[0], c.price[11]), v => fmtPct(v, false), 'max'],
    ['Sales / month', 'How easy to buy or sell', c => avg(c.sales), v => v.toFixed(1).replace(/\.0$/, ''), 'max'],
    ['Graded population', 'Copies that exist at this grade', c => c.pop ? last(c.pop) : null, v => v.toLocaleString('en-US'), 'min'],
    ['Population growth', 'New graded copies, 1 year', c => c.pop ? pct(c.pop[0], c.pop[11]) : null, v => fmtPct(v, false), 'min'],
    ['Volatility', 'Average monthly swing', c => avg(c.price.slice(1).map((v, i) => Math.abs(pct(c.price[i], v)))), v => v.toFixed(1) + '%', 'min']
  ];
  const insight = (() => {
    if (ids.length < 2) return 'Add at least two cards to compare them.';
    const cs = ids.map(id => CARD[id]);
    if (metric === 'price') { const ch = cs.map(c => [c, pct(slice(c.price, range)[0], last(c.price))]).sort((a, b) => b[1] - a[1]); return `${PLAYERS[ch[0][0].p].name}'s card performed best over this period (${fmtPct(ch[0][1], false)}). ${PLAYERS[last(ch)[0].p].name}'s did worst (${fmtPct(last(ch)[1], false)}).`; }
    if (metric === 'sales') { const s = cs.map(c => [c, avg(slice(c.sales, range))]).sort((a, b) => b[1] - a[1]); return `${PLAYERS[s[0][0].p].name}'s card sells most often, about ${Math.round(s[0][1])} times a month. Cards that trade often react faster to news, in both directions.`; }
    const g = cs.filter(c => c.pop).map(c => [c, pct(slice(c.pop, range)[0], last(c.pop))]).sort((a, b) => b[1] - a[1]);
    return g.length ? `${PLAYERS[g[0][0].p].name}'s graded supply grew fastest (${fmtPct(g[0][1], false)}). More graded copies means more supply, which can cap prices.` : 'None of these cards are graded, so there is no population to compare.';
  })();
  return `<div class="view">
    <div class="section" style="padding-top:8px"><h1>Compare cards</h1><p class="lede">Put up to four cards on one chart and see how they stack up on price, sales and supply.</p></div>
    <div class="section">
      <div class="list">${ids.map((id, k) => { const c = CARD[id]; return `<div class="item"><svg width="28" height="10" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" stroke="${colors[k]}" stroke-width="3" stroke-linecap="round"${dashes[k] ? ` stroke-dasharray="${dashes[k]}"` : ''}/></svg><div class="main"><span class="title">${esc(c.name)}</span><span class="sub">${esc(PLAYERS[c.p].name)} · ${esc(c.detail)}</span></div><button type="button" class="btn" style="min-height:36px;padding:0 10px" data-act="removeCompare" data-id="${id}" aria-label="Remove ${esc(c.name)}">Remove</button></div>`; }).join('')}</div>
      ${ids.length < 4 ? `<label for="addCompare" class="row" style="gap:8px;font-size:14px;color:var(--muted)">Add a card
        <select id="addCompare" style="min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%">
          <option value="">Choose a card…</option>
          ${Object.keys(PLAYERS).filter(pid => CARDS.some(c => c.p === pid)).map(pid => `<optgroup label="${esc(PLAYERS[pid].name)}">${CARDS.filter(c => c.p === pid && !ids.includes(c.id)).map(c => `<option value="${c.id}">${esc(c.name)} · ${esc(c.detail)}</option>`).join('')}</optgroup>`).join('')}
        </select></label>` : ''}
    </div>
    <div class="panel section">
      <div class="row">${segBtns('compareMetric', [['price', 'Price'], ['sales', 'Sales volume'], ['pop', 'Population']], metric)}${segBtns('compareView', [['pct', '% change'], ['actual', 'Actual']], view)}${segBtns('compareRange', [['3M', '3M'], ['6M', '6M'], ['1Y', '1Y']], range)}</div>
      ${series.length ? lineChart('ch-compare', { series, labels: slice(MONTHS, range), fmt, zero: view === 'pct' }) : '<p class="lede">No data for this view.</p>'}
      ${metric === 'pop' && usable.length < ids.length ? '<span style="font-size:12px;color:var(--faint)">Raw cards have no graded population, so they are left off this view.</span>' : ''}
    </div>
    <div class="why"><span class="eyebrow">What this means</span><p>${esc(insight)}</p></div>
    ${ids.length ? `<div class="section"><h2>Side-by-side stats</h2><div class="tablebox"><table><thead><tr><th scope="col">Stat</th>${ids.map(id => `<th scope="col">${esc(PLAYERS[CARD[id].p].short)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([label, help, get, f, best]) => { const vals = ids.map(id => get(CARD[id])); const nums = vals.filter(v => v !== null); const b = best && nums.length > 1 ? (best === 'max' ? Math.max(...nums) : Math.min(...nums)) : null;
        return `<tr><th scope="row">${label}${help ? `<span class="help">${help}</span>` : ''}</th>${vals.map(v => `<td class="${v !== null && v === b ? 'best' : ''}">${v === null ? '—' : esc(f(v))}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div><span style="font-size:12px;color:var(--faint)">Brighter value = best of the group for that stat.</span></div>` : ''}
  </div>`;
}

/* ---------- biggest movers ---------- */
function moverCards() {
  const range = state.moversRange, minSales = parseInt(state.moversMin, 10) || 0;
  return CARDS
    .filter(c => state.moversSport === 'All' || PLAYERS[c.p].sport === state.moversSport)
    .filter(c => state.moversGrade === 'All' || (state.moversGrade === 'graded' ? c.tags.includes('Graded') : !c.tags.includes('Graded')))
    .map(c => {
      const p = slice(c.price, range), s = slice(c.sales, range);
      return { c, p, change: pct(p[0], last(p)), sales: s.reduce((a, b) => a + b, 0), recent: last(c.sales) };
    })
    .filter(r => isFinite(r.change) && r.sales >= minSales && (minSales === 0 || r.recent > 0));
}
function moverPlayers() {
  return Object.keys(PLAYERS)
    .filter(pid => state.moversSport === 'All' || PLAYERS[pid].sport === state.moversSport)
    .map(pid => {
      const cs = CARDS.filter(c => c.p === pid && (state.moversGrade === 'All' || (state.moversGrade === 'graded' ? c.tags.includes('Graded') : !c.tags.includes('Graded'))));
      if (!cs.length) return null;
      const t = combined(cs, state.moversRange);
      return { pid, p: PLAYERS[pid], change: t.change, series: t.series, sales: cs.reduce((a, c) => a + slice(c.sales, state.moversRange).reduce((x, y) => x + y, 0), 0), n: cs.length };
    })
    .filter(r => r && isFinite(r.change));
}
function moverRow(r, i) {
  const c = r.c;
  return `<a class="item" href="#card-${c.id}"><span class="num" style="width:22px;color:var(--faint);font-size:13px;text-align:right">${i + 1}</span>${flameThumb(c, cardVisual(c))}<div class="main"><span class="title">${esc(c.name)}</span><span class="sub">${esc(PLAYERS[c.p].name)} · ${esc(c.detail)} · ${r.sales} sale${r.sales === 1 ? '' : 's'}</span></div>${hotTag(c.id)}<span class="spark" aria-hidden="true">${sparkline(r.p, r.change >= 0 ? 'var(--up)' : 'var(--down)')}</span><div class="end"><span class="num" style="font-weight:600">${money(last(c.price))}</span><span class="num ${cls(r.change)}" style="font-size:13px;font-weight:600">${fmtPct(r.change)}</span></div></a>`;
}
function moverPlayerRow(r, i) {
  return `<a class="item" href="#player-${r.pid}"><span class="num" style="width:22px;color:var(--faint);font-size:13px;text-align:right">${i + 1}</span><div class="main"><span class="title">${esc(r.p.name)}</span><span class="sub">${esc(r.p.sport)} · ${r.n} card versions · ${r.sales} sales</span></div><span class="spark" aria-hidden="true">${sparkline(r.series, r.change >= 0 ? 'var(--up)' : 'var(--down)')}</span><div class="end"><span class="num ${cls(r.change)}" style="font-size:15px;font-weight:600">${fmtPct(r.change)}</span></div></a>`;
}
function viewMovers() {
  const label = { '1M': 'this month', '3M': 'over 3 months', '6M': 'over 6 months', '1Y': 'over the past year' }[state.moversRange];
  const isCards = state.moversView === 'cards';
  const rows = isCards ? moverCards() : moverPlayers();
  const up = [...rows].filter(r => r.change > 0.05).sort((a, b) => b.change - a.change);
  const down = [...rows].filter(r => r.change < -0.05).sort((a, b) => a.change - b.change);
  const flat = rows.length - up.length - down.length;
  const changes = rows.map(r => r.change).sort((a, b) => a - b);
  const median = changes.length ? changes[Math.floor(changes.length / 2)] : 0;
  const row = isCards ? moverRow : moverPlayerRow;
  const sports = ['All', ...new Set(Object.values(PLAYERS).map(p => p.sport))];
  return `<div class="view">
    <div class="section" style="padding-top:8px"><h1>Biggest movers</h1><p class="lede">The cards and players gaining and losing the most value ${label}, based on completed sales.</p></div>
    <div class="panel section">
      <div class="row">${segBtns('moversView', [['cards', 'Cards'], ['players', 'Players']], state.moversView)}${segBtns('moversRange', [['1M', '1M'], ['3M', '3M'], ['6M', '6M'], ['1Y', '1Y']], state.moversRange)}${segBtns('moversGrade', [['All', 'All'], ['raw', 'Raw'], ['graded', 'PSA 10']], state.moversGrade)}</div>
      <div class="row between">
        <div class="chips">${sports.map(s => `<button type="button" class="chip" data-set="moversSport" data-val="${s}" aria-pressed="${s === state.moversSport}">${s}</button>`).join('')}</div>
        <label for="minSales" class="row" style="gap:8px;font-size:13px;color:var(--muted)">Minimum sales
          <select id="minSales" style="min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px">
            ${[['0', 'Any'], ['3', '3+'], ['10', '10+'], ['25', '25+']].map(([v, l]) => `<option value="${v}"${v === state.moversMin ? ' selected' : ''}>${l}</option>`).join('')}
          </select></label>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><span class="k">Rising</span><span class="v up">${up.length}</span></div>
      <div class="tile"><span class="k">Falling</span><span class="v down">${down.length}</span></div>
      <div class="tile"><span class="k">Flat</span><span class="v flat">${flat}</span></div>
      <div class="tile"><span class="k">Typical change</span><span class="v ${cls(median)}">${fmtPct(median)}</span></div>
    </div>
    ${rows.length ? `<div class="cols">
      <div class="section"><h2><span class="up">▲</span> Biggest risers</h2><div class="list">${up.slice(0, 10).map(row).join('') || '<p class="lede">Nothing rising with these filters.</p>'}</div></div>
      <div class="section"><h2><span class="down">▼</span> Biggest drops</h2><div class="list">${down.slice(0, 10).map(row).join('') || '<p class="lede">Nothing falling with these filters.</p>'}</div></div>
    </div>` : `<div class="panel empty"><h2>No ${isCards ? 'cards' : 'players'} match these filters</h2><p class="lede">Try a longer time range or a lower minimum sales count.</p></div>`}
    <span style="font-size:12px;color:var(--faint)">Change compares the typical sale price at the start and end of the period. The current month includes sales so far, and single sales far outside a card's normal range are ignored. The minimum sales filter hides cards with too few sales to trust, since one unusual sale can swing a price a lot.</span>
  </div>`;
}
const notFound = () => `<div class="view"><div class="panel empty"><h2>That page doesn't exist</h2><a class="btn primary" href="#home">Go home</a></div></div>`;

/* ---------- global search (top bar) ---------- */
const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
function hl(text, q) {
  const t = String(text), f = fold(t), w = fold(q).trim().split(/\s+/)[0];
  const i = w ? f.indexOf(w) : -1;
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + w.length)) + '</mark>' + esc(t.slice(i + w.length));
}
function searchAll(raw) {
  const q = fold(raw).trim(); if (!q) return [];
  const words = q.split(/\s+/);
  const has = new Set(CARDS.map(c => c.p));
  const score = text => {
    const t = fold(text);
    if (!words.every(w => t.includes(w))) return -1;
    if (t.startsWith(q)) return 3;
    return t.split(/[\s.'-]+/).some(x => x.startsWith(words[0])) ? 2 : 1;
  };
  return Object.entries(PLAYERS).map(([id, p]) => ({ kind: 'player', id, p, s: score(p.name), cards: has.has(id) }))
    .filter(r => r.s >= 0).sort((a, b) => b.s - a.s || (b.cards - a.cards) || a.p.name.localeCompare(b.p.name)).slice(0, 8);
}
const gs = { items: [], active: -1 };
function gOpen(open) { const box = $('#gresults'), inp = $('#gq'); box.hidden = !open; inp.setAttribute('aria-expanded', open ? 'true' : 'false'); }
function gRender() {
  const box = $('#gresults'), inp = $('#gq'), q = inp.value;
  if (!q.trim()) { gOpen(false); return; }
  const items = gs.items;
  if (!items.length) { box.innerHTML = `<div class="gempty">No players match “${esc(q)}”.</div>`; gOpen(true); return; }
  let html = '', lastKind = '';
  items.forEach((r, i) => {
    const sel = i === gs.active ? 'true' : 'false';
    if (r.kind === 'player') {
      const sub = [r.p.team, r.p.pos, r.p.sport].filter(Boolean).join(' · ') + (r.cards ? '' : ' · card prices coming soon');
      html += `<a class="gres" role="option" id="gr-${i}" aria-selected="${sel}" href="#player-${r.id}"><span class="gbadge${r.p.teamAbbr ? ' team' : ''}" style="--tc:${r.p.color || 'var(--line)'}">${esc(r.p.teamAbbr || r.p.sport)}</span><span class="gm"><span class="gt">${hl(r.p.name, q)}</span><span class="gs">${esc(sub)}</span></span>${r.p.injured ? `<span class="status injured">${esc(r.p.injured)}</span>` : ''}</a>`;
    } else {
      const m = monthChange(r.c);
      html += `<a class="gres" role="option" id="gr-${i}" aria-selected="${sel}" href="#card-${r.c.id}"><span class="gthumb">${cardVisual(r.c)}</span><span class="gm"><span class="gt">${hl(r.c.name, q)}</span><span class="gs">${esc(PLAYERS[r.c.p].name)} · ${esc(r.c.detail)}</span></span><span class="num" style="text-align:right;font-size:13px">${money(last(r.c.price))}<br><span class="${cls(m)}">${fmtPct(m)}</span></span></a>`;
    }
  });
  box.innerHTML = html; gOpen(true);
  const act = gs.active >= 0 && document.getElementById('gr-' + gs.active);
  if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
  inp.setAttribute('aria-activedescendant', gs.active >= 0 ? 'gr-' + gs.active : '');
}
function gGo(i) {
  const r = gs.items[i]; if (!r) return;
  location.hash = r.kind === 'player' ? 'player-' + r.id : 'card-' + r.c.id;
  gClose();
}
function gClose() { const inp = $('#gq'); inp.value = ''; gs.items = []; gs.active = -1; gOpen(false); inp.blur(); }
(function wireSearch() {
  const inp = $('#gq'), box = $('#gresults');
  if (!inp || !inp.addEventListener) return;
  inp.addEventListener('input', () => { gs.items = searchAll(inp.value); gs.active = gs.items.length ? 0 : -1; gRender(); });
  inp.addEventListener('focus', () => { if (inp.value.trim()) gRender(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (gs.items.length) { gs.active = (gs.active + 1) % gs.items.length; gRender(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (gs.items.length) { gs.active = (gs.active - 1 + gs.items.length) % gs.items.length; gRender(); } }
    else if (e.key === 'Enter') { e.preventDefault(); gGo(gs.active >= 0 ? gs.active : 0); }
    else if (e.key === 'Escape') { gClose(); }
  });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { if (e.target.closest('.gres')) setTimeout(gClose, 0); });
  inp.addEventListener('blur', () => setTimeout(() => gOpen(false), 120));
})();

/* ---------- router ---------- */
function render() {
  const h = (location.hash || '#home').slice(1);
  Object.keys(charts).forEach(k => delete charts[k]);
  let html, nav = '';
  if (h === 'home' || h === '') { html = viewHome(); nav = 'home'; }
  else if (h.startsWith('player-')) html = viewPlayer(h.slice(7));
  else if (h.startsWith('card-')) html = viewCard(h.slice(5));
  else if (h === 'compare') { html = viewCompare(); nav = 'compare'; }
  else if (h === 'movers') { html = viewMovers(); nav = 'movers'; }
  else if (h === 'collection') { html = viewCollection(); nav = 'collection'; }
  else if (h === 'build') { html = viewBuild(); nav = 'build'; }
  else html = notFound();
  $('#app').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  wireCharts();
  const q = $('#q');
  if (q) q.addEventListener('input', e => { state.homeQuery = e.target.value; const pos = e.target.selectionStart; render(); const nq = $('#q'); nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (err) {} });
  const ms = $('#minSales'); if (ms) ms.addEventListener('change', e => { state.moversMin = e.target.value; render(); });
  const sort = $('#sort'); if (sort) sort.addEventListener('change', e => { state.playerSort = e.target.value; render(); });
  const photo = $('#photo'); if (photo) photo.addEventListener('change', e => handlePhoto(e.target.files[0], e.target.dataset.id));
  const add = $('#addCompare'); if (add) add.addEventListener('change', e => { if (e.target.value) { state.compareIds.push(e.target.value); render(); } });
  updateCount();
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-set]');
  if (s) { state[s.dataset.set] = s.dataset.val; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  if (a.dataset.act === 'toggleCol') { const ids = col(); const has = ids.includes(id); setCol(has ? ids.filter(x => x !== id) : [...ids, id]); toast(has ? 'Removed from your collection' : 'Added to your collection'); render(); }
  if (a.dataset.act === 'sampleCol') { setCol(['curry-chrome-base', 'ohtani-update', 'griffey-ud']); toast('Added 3 sample cards'); render(); }
  if (a.dataset.act === 'removePhoto') { setPhoto(id, null); toast('Showing artwork'); render(); }
  if (a.dataset.act === 'removeCompare') { state.compareIds = state.compareIds.filter(x => x !== id); render(); }
  if (a.dataset.act === 'compareThis') { if (!state.compareIds.includes(id)) state.compareIds = [id, ...state.compareIds.filter(x => x !== id)].slice(0, 4); else state.compareIds = [id, ...state.compareIds.filter(x => x !== id)]; location.hash = 'compare'; }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
loadRepoImages();
loadRealData();
</script>
</body>
</html>
